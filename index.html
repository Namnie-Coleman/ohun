/* ── 공유 카드 사진 (카메라 촬영 · 앨범) ── */
let _cam={stream:null,facing:'environment'};
function stopCam(){if(_cam.stream)_cam.stream.getTracks().forEach(t=>t.stop());_cam.stream=null;}
async function openCardCam(id){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('cardFile').setAttribute('capture','environment');$('cardFile').click();return;}
  openSheet(`<div class="sheet-h"><h2>사진 찍기</h2><button class="link" onclick="stopCam();openShareCard('${id}')">취소</button></div>
  <div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:9/16;max-height:62vh;margin:0 auto"><video id="camV" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
  <div style="position:absolute;inset:auto 0 12px 0;text-align:center;color:#fff;font-size:12px;opacity:.8">세로 사진이 카드에 꽉 차게 들어갑니다</div></div>
  <div class="row-btns" style="margin-top:12px"><button class="btn ghost" style="flex:0 0 30%" onclick="flipCam()">전환</button><button class="btn" onclick="snapCam('${id}')">촬영</button></div>`);
  await startCam();
}
async function startCam(){
  stopCam();const v=$('camV');if(!v)return;
  try{_cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:_cam.facing,width:{ideal:1080},height:{ideal:1920}},audio:false});v.srcObject=_cam.stream;await v.play();}
  catch(e){toast('카메라를 쓸 수 없어요. 권한을 허용하거나 앨범에서 고르세요');const id=window._cardId;stopCam();openShareCard(id);}
}
function flipCam(){_cam.facing=_cam.facing==='environment'?'user':'environment';startCam();}
function snapCam(id){
  const v=$('camV');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const g=c.getContext('2d');
  if(_cam.facing==='user'){g.translate(c.width,0);g.scale(-1,1);}g.drawImage(v,0,0);stopCam();
  const im=new Image();im.onload=()=>{window._cardPhoto=im;window._cardPhotoFor=id;openShareCard(id);};im.src=c.toDataURL('image/jpeg',.9);
}
function cardFilePicked(ev,id){const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;const im=new Image();im.onload=()=>{window._cardPhoto=im;window._cardPhotoFor=id;openShareCard(id);};im.src=URL.createObjectURL(f);}

/* ══════════════════════ 식단 v2: 끼니별 (아침·점심·저녁·간식) ══════════════════════ */
const MEALS=[['b','아침'],['l','점심'],['d','저녁'],['s','간식']];
const MEAL_L=Object.fromEntries(MEALS);
let dietDate='',dietMeal='';
const dietDay=()=>dietDate||today();
function mealByHour(h){return h>=4&&h<10?'b':h>=10&&h<15?'l':h>=17&&h<22?'d':'s';}
function mealOf(f){if(f.meal)return f.meal;const t=parseInt(String(f.id||'').slice(1,-3),36);return mealByHour(t>1e12?new Date(t).getHours():20);}
function addFoodEntry(o){o.date=dietDay();o.meal=dietMeal||(dietDay()===today()?mealByHour(new Date().getHours()):'s');S.food.push(o);}
function dietShift(d){const x=new Date(dietDay()+'T12:00');x.setDate(x.getDate()+d);const v=ymdL(x);dietDate=v>=today()?'':v;renderDiet();}
function ring(p,col,size=118,sw=12){const r=(size-sw)/2,c=2*Math.PI*r,o=c*(1-Math.min(1,Math.max(0,p)));
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;}
const waterTarget=()=>S.profile.weight?Math.round(S.profile.weight*33/250)*250:2000;
function addWater(ml){const d=dietDay();S.water=S.water||{};S.water[d]=Math.max(0,(S.water[d]||0)+ml);if(!S.water[d])delete S.water[d];save();renderDiet();}
function renderDiet(){
  const day=dietDay(),tg=dietPlan(),t=foodTotals(day),list=S.food.filter(f=>f.date===day),isT=day===today();
  const left=tg?Math.round(tg.kcal-t.kcal):null,over=left!=null&&left<0;
  const dt=new Date(day+'T00:00'),dlab=isT?'오늘':day===daysAgo(1)?'어제':`${dt.getMonth()+1}월 ${dt.getDate()}일 (${DAYS[dt.getDay()]})`;
  const mac=(l,v,g,col)=>`<div style="flex:1;min-width:0"><div class="tiny" style="display:flex;justify-content:space-between"><span>${l}</span><span>${Math.round(v)}${g?'/'+g:''}g</span></div><div style="height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden"><div style="height:100%;width:${g?Math.min(100,v/g*100):0}%;background:${col};border-radius:3px"></div></div></div>`;
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px"><button class="btn ghost sm" style="width:40px;padding:8px 0" onclick="dietShift(-1)" aria-label="이전 날">‹</button><b style="font-size:16px">${dlab}</b><button class="btn ghost sm" style="width:40px;padding:8px 0;${isT?'opacity:.3':''}" onclick="dietShift(1)" aria-label="다음 날">›</button></div>
  <div class="card">${tg?`<div style="display:flex;align-items:center;gap:16px">
    <div style="position:relative;width:118px;height:118px;flex:none">${ring(t.kcal/tg.kcal,over?'var(--bad)':'var(--pri)')}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:24px;line-height:1">${fmt(Math.abs(left))}</b><span class="tiny">${over?'초과 kcal':'남은 kcal'}</span></div></div>
    <div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="tiny">목표</span><b>${fmt(tg.kcal)}</b></div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="tiny">섭취</span><b>${fmt(t.kcal)}</b></div><div style="display:flex;justify-content:space-between"><span class="tiny">${tg.mode}</span><button class="link" style="font-size:12px" onclick="openPlan()">근거</button></div></div></div>
    <div style="display:flex;gap:12px;margin-top:14px">${mac('탄수화물',t.c,tg.c,'var(--warn)')}${mac('단백질',t.p,tg.p,'var(--good)')}${mac('지방',t.f,tg.f,'var(--text3)')}</div>`
    :`<div class="muted">프로필을 입력하면 목표 칼로리와 영양소가 계산됩니다.</div><button class="btn sub" style="margin-top:10px" onclick="openOnboarding()">프로필 설정</button>`}</div>`;
  MEALS.forEach(([k,l])=>{
    const its=list.filter(f=>mealOf(f)===k),kc=its.reduce((a,f)=>a+(f.kcal||0),0),pr=its.reduce((a,f)=>a+(f.p||0),0);
    h+=`<div class="card" style="padding:12px 14px">
    <div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div class="card-t">${l}</div><div class="tiny">${its.length?`${fmt(kc)} kcal · 단백질 ${r1(pr)}g`:'아직 기록 없음'}</div></div>
      ${its.length?`<button class="link" style="font-size:12px" onclick="openSaveMeal('${k}')">저장</button>`:''}<button class="btn sm" style="width:38px;height:38px;padding:0;border-radius:50%;font-size:22px;line-height:1" onclick="openFoodAdd('${k}')" aria-label="${l} 추가">+</button></div>
    ${its.length?`<div style="margin-top:8px;border-top:1px solid var(--line)">${its.map(f=>`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</div><div class="tiny">탄 ${r1(f.c)} · 단 ${r1(f.p)} · 지 ${r1(f.f)}</div></div><b style="white-space:nowrap">${fmt(f.kcal)}</b><button class="x" style="position:static" onclick="delFood('${f.id}')" aria-label="삭제">×</button></div>`).join('')}</div>`:''}</div>`;
  });
  h+=suppCardHTML(day);
  {const wml=(S.water||{})[day]||0,wt=waterTarget(),cups=Math.ceil(wt/250),fill=Math.min(cups,Math.round(wml/250));
   h+=`<div class="card" style="padding:12px 14px"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div class="card-t">물</div><div class="tiny">${fmt(wml)} / ${fmt(wt)}ml${wml>=wt?' · 목표 달성':''}</div></div>
     <button class="btn ghost sm" style="width:38px;height:38px;padding:0;border-radius:50%;font-size:20px" onclick="addWater(-250)" aria-label="물 한 컵 빼기" ${wml?'':'disabled'}>−</button><button class="btn sm" style="width:auto;height:38px;padding:0 12px;border-radius:19px" onclick="addWater(250)">+ 1컵</button></div>
     <div class="wcups">${[...Array(cups)].map((_,i)=>`<i class="${i<fill?'on':''}"></i>`).join('')}</div></div>`;}
  if(tg&&list.length){const ps=MEALS.map(([k])=>list.filter(f=>mealOf(f)===k).reduce((a,f)=>a+(f.p||0),0));const main=ps.slice(0,3).filter(v=>v>0);
    if(main.length>=2&&Math.max(...main)>Math.min(...main)*2.5)h+=`<div class="note n-pri" style="margin:0 0 12px"><b>단백질을 끼니에 고르게</b>끼니마다 ${Math.round(tg.p/4)}g 안팎으로 나누면 근육 합성에 더 유리합니다.</div>`;}
  h+=`<div class="tiny" style="text-align:center;margin-bottom:8px">음식 수치는 대략값입니다. 포장 영양정보가 있으면 직접 입력이 가장 정확합니다.</div>`;
  $('v-diet').innerHTML=h;
}

function adjustPixels(id,o){
  const P=CARD_FILTERS[o.filter]?.[1]||{},v=k=>(P[k]||0)+(o[k]||0);

/* ── 공용 타이머 엔진 (WOD · 단독 타이머 공용) ── */
let tm=null,tmRaf=0;
function say(t){try{if(!S.voice||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function tmOpen(cfg){
  // cfg: {kind:'time'|'amrap'|'emom'|'tabata'|'countdown'|'stopwatch', title, dur(s), cap(s), int(s), work, rest, rounds, steps:[text], wid}
  tm={...cfg,state:'ready',t0:0,pausedAt:0,acc:0,round:0,laps:[],lastBeep:-1,lastCue:''};
  let ov=$('tmOv');if(!ov){ov=document.createElement('div');ov.id='tmOv';ov.className='wm';document.body.appendChild(ov);}
  ov.classList.add('on');document.body.style.overflow='hidden';keepAwake(true);tmRender();
}
function tmClose(){cancelAnimationFrame(tmRaf);const ov=$('tmOv');if(ov)ov.classList.remove('on');document.body.style.overflow='';keepAwake(false);try{speechSynthesis.cancel();}catch(e){}tm=null;}
const tmEl=()=>tm?(tm.state==='run'?tm.acc+(Date.now()-tm.t0)/1000:tm.acc):0;
function tmStart(){if(tm.state==='ready'&&tm.kind!=='stopwatch'&&tm.kind!=='countdown'){tm.state='pre';tm.preEnd=Date.now()+10000;tmLoop();tmRender();return;}tm.state='run';tm.t0=Date.now();if(!tm.round)tm.round=1;tmLoop();tmRender();}
function tmPause(){if(tm.state!=='run')return;tm.acc=tmEl();tm.state='pause';tmRender();}
function tmResume(){tm.state='run';tm.t0=Date.now();tmLoop();tmRender();}
function tmLap(){const e=tmEl();tm.laps.push(e);tm.round++;beep(1);tmRender();}
function tmPhase(e){ // 현재 단계 계산
  if(tm.kind==='emom'){const i=tm.int||60,k=Math.floor(e/i);return{label:`${k+1} / ${Math.round(tm.dur/i)} 분`,left:i-(e%i),step:tm.steps[k%tm.steps.length],k,total:tm.dur};}
  if(tm.kind==='tabata'){const w=tm.work||20,r=tm.rest||10,cyc=w+r,k=Math.floor(e/cyc),inW=(e%cyc)<w,n=tm.steps.length*(tm.rounds||8);
    return{label:`${Math.min(k+1,n)} / ${n} 라운드`,left:inW?w-(e%cyc):cyc-(e%cyc),work:inW,step:tm.steps[Math.floor(k/(tm.rounds||8))%tm.steps.length],k,total:n*cyc-r};}
  if(tm.kind==='amrap'||tm.kind==='countdown')return{left:tm.dur-e,total:tm.dur};
  return{total:tm.cap||0};
}
function tmLoop(){cancelAnimationFrame(tmRaf);const f=()=>{if(!tm)return;
  if(tm.state==='pre'){const l=Math.ceil((tm.preEnd-Date.now())/1000);if(l!==tm.lastBeep){tm.lastBeep=l;if(l<=3&&l>0){beep(1);say(String(l));}}if(l<=0){tm.state='run';tm.t0=Date.now();tm.round=1;beep(3);say('시작');tm.lastBeep=-1;tmRender();}tmTick();tmRaf=requestAnimationFrame(f);return;}
  if(tm.state!=='run'){tmTick();return;}
  const e=tmEl(),ph=tmPhase(e);
  if(ph.total&&e>=ph.total&&tm.kind!=='stopwatch'){tm.acc=ph.total;tm.state='done';beep(3);say(tm.kind==='time'?'시간 종료':'종료');tmRender();return;}
  if(ph.left!=null){const l=Math.ceil(ph.left);const key=(ph.k??0)+':'+l;if(l<=3&&l>0&&key!==tm.lastCue){tm.lastCue=key;beep(1);say(String(l));}
    if(tm.kind==='tabata'||tm.kind==='emom'){const pk=(ph.k??0)+(ph.work===false?'r':'w');if(pk!==tm.lastPk){if(tm.lastPk!=null){beep(2);say(tm.kind==='tabata'?(ph.work?'운동':'휴식'):'다음');}tm.lastPk=pk;}}
    if(tm.kind!=='tabata'&&tm.kind!=='emom'&&ph.left<=60.5&&ph.left>59.5&&tm.lastCue!=='1m'){tm.lastCue='1m';say('1분 남았습니다');}}
  tmTick();tmRaf=requestAnimationFrame(f);};tmRaf=requestAnimationFrame(f);}
function tmTick(){const el=$('tmBig');if(!el||!tm)return;
  if(tm.state==='pre'){el.textContent=Math.max(0,Math.ceil((tm.preEnd-Date.now())/1000));return;}
  const e=tmEl(),ph=tmPhase(e);el.textContent=ph.left!=null&&tm.kind!=='stopwatch'?mmss(Math.max(0,ph.left)):mmssc(e);
  const lb=$('tmLbl');if(lb)lb.textContent=ph.label||(tm.cap?`제한 ${mmss(tm.cap)}`:'');
  const st=$('tmStep');if(st&&ph.step!=null){st.textContent=(tm.kind==='tabata'&&!ph.work)?'휴식':ph.step;}
  const ov=$('tmOv');if(ov)ov.style.background=tm.kind==='tabata'&&tm.state==='run'?(ph.work?'':'var(--card2)'):'';
  const tot=$('tmTot');if(tot)tot.textContent=(tm.kind==='emom'||tm.kind==='tabata'||tm.kind==='amrap')?`전체 ${mmss(e)} / ${mmss(ph.total)}`:'';
}
const mmssc=s=>{const m=Math.floor(s/60),x=s-m*60;return`${m}:${String(Math.floor(x)).padStart(2,'0')}.${Math.floor((x%1)*10)}`;};
function tmRender(){
  const ov=$('tmOv');if(!ov||!tm)return;const run=tm.state==='run',done=tm.state==='done',canRound=tm.kind==='amrap'||(tm.kind==='time'&&(tm.rounds||1)>1)||tm.kind==='stopwatch';
  ov.innerHTML=`<div class="wm-top"><button class="link" onclick="${run?'tmPause();':''}confirmSheet('타이머를 끝낼까요?',()=>{closeSheet();tmClose();},'끝내기')">닫기</button><div style="text-align:center"><b>${esc(tm.title)}</b>${(()=>{const sub=tm.kind==='stopwatch'?'스톱워치':tm.kind==='countdown'?'타이머':WOD_T[tm.kind]||'';return sub&&sub!==tm.title?`<div class="tiny">${sub}</div>`:''})()}</div>
  <button class="link" onclick="S.voice=S.voice?0:1;saveLocal();tmRender()">${S.voice?'음성 켬':'음성 끔'}</button></div>
  <div class="wm-body" style="text-align:center;padding-top:6vh">
  <div id="tmStep" style="font-size:22px;font-weight:800;min-height:30px;margin-bottom:6px">${tm.state==='pre'?'준비':tm.steps&&tm.kind!=='emom'&&tm.kind!=='tabata'?'':''}</div>
  <div id="tmBig" style="font-size:min(26vw,120px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-2px">0:00</div>
  <div id="tmLbl" class="muted" style="margin-top:6px"></div><div id="tmTot" class="tiny" style="margin-top:4px"></div>
  ${canRound&&tm.state!=='ready'?`<div style="margin:18px 0 6px"><span class="tiny">${tm.kind==='stopwatch'?'랩':'라운드'}</span><div style="font-size:42px;font-weight:900">${tm.kind==='stopwatch'?tm.laps.length:tm.round}</div></div>`:''}
  ${tm.steps&&tm.steps.length&&(tm.kind==='time'||tm.kind==='amrap')?`<div class="card" style="text-align:left;margin-top:12px">${tm.steps.map(t=>`<div style="padding:4px 0">${esc(t)}</div>`).join('')}</div>`:''}
  ${tm.kind==='stopwatch'&&tm.laps.length?`<div class="card" style="text-align:left;max-height:30vh;overflow:auto">${tm.laps.map((l,i)=>`<div style="display:flex;justify-content:space-between;padding:4px 0" class="tiny"><span>랩 ${i+1}</span><span>${mmssc(l-(tm.laps[i-1]||0))}</span><b>${mmssc(l)}</b></div>`).reverse().join('')}</div>`:''}
  </div>
  <div class="wm-foot" style="display:flex;gap:8px">${tm.state==='ready'?`<button class="btn" onclick="tmStart()">${tm.kind==='stopwatch'||tm.kind==='countdown'?'시작':'10초 후 시작'}</button>`
    :tm.state==='pre'?`<button class="btn ghost" onclick="tm.preEnd=Date.now()">바로 시작</button>`
    :done?(tm.wid?`<button class="btn" onclick="wodFinish()">기록 저장</button>`:`<button class="btn" onclick="tmClose()">닫기</button>`)
    :`${canRound&&run?`<button class="btn sub" style="flex:1" onclick="tmLap()">${tm.kind==='stopwatch'?'랩':'라운드 +1'}</button>`:''}
      ${run?`<button class="btn ghost" style="flex:1 0 30%" onclick="tmPause()">일시정지</button>`:`<button class="btn ghost" style="flex:1 0 30%" onclick="tmResume()">계속</button>`}
      ${tm.kind==='time'||tm.kind==='stopwatch'?`<button class="btn" style="flex:1" onclick="tm.acc=tmEl();tm.state='done';beep(2);say('완료');tmRender()">${tm.kind==='time'?'완료':'정지'}</button>`:''}`}</div>`;
  tmTick();if(tm.state==='pre'||tm.state==='run')tmLoop();
}
function startWod(id){
  const w=wodById(id);if(!w)return;closeSheet();
  const steps=wodMvTxt(w);
  tmOpen({kind:w.type,title:w.name,wid:w.id,steps:w.type==='emom'&&w.same?[steps.join(' · ')]:steps,dur:(w.dur||0)*60,cap:(w.cap||0)*60,int:w.int||60,work:w.work||20,rest:w.rest||10,rounds:w.type==='tabata'?(w.tr||8):(w.rounds||1)});

    :w.type==='time'?`<div class="field"><label class="lbl">기록</label><input class="inp" id="wfT" value="${mmss(e)}" placeholder="분:초"></div><div class="tiny">제한 시간 안에 못 끝냈다면 기록 대신 메모에 남은 반복을 적으세요</div>`

  <div class="field" style="margin-top:10px"><label class="lbl">메모</label><input class="inp" id="wfM" placeholder="스케일 내용, 컨디션"></div></div>
  <button class="btn" onclick="wodSave()">저장</button>`);

function wodSave(){
  const w=wodById(tm.wid),r={id:uid('wr'),date:today(),wid:w.id,name:w.name,type:w.type,rx:$('wfRx').checked,memo:$('wfM').value.trim()};
  if(w.type==='amrap'){r.rounds=parseInt($('wfR').value)||0;r.reps=parseInt($('wfP').value)||0;}
  else if(w.type==='time'){const m=$('wfT').value.trim().split(':');r.time=m.length>1?(parseInt(m[0])||0)*60+(parseInt(m[1])||0):parseInt(m[0])||0;}
  else r.time=Math.round(tmEl());
  const prev=wodBest(w.id);S.wods=S.wods||[];S.wods.push(r);
  // 운동 기록(오운완 달력·공유 카드)에도 남김
  const mult=w.type==='amrap'?Math.max(1,r.rounds):w.type==='emom'?Math.max(1,Math.round(w.dur*60/(w.int||60)/w.mv.length)):w.type==='tabata'?1:(w.rounds||1);
  const exs=w.mv.filter(([n])=>exInfo(n).eq!=='run').map(([n,reps,kg])=>({name:n,sets:[{w:kg&&r.rx?wkg(kg):0,r:reps.reduce((a,b)=>a+b,0)*mult}]}));if(!exs.length)exs.push({name:'버피',sets:[{w:0,r:1}]});
  const log=finalizeLog({id:uid('l'),date:today(),memo:r.memo,ts:Date.now(),exs,title:`WOD ${w.name} · ${wodRes(r)}${r.rx?' Rx':''}`});
  S.logs.push(log);S.logs.sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));save();tmClose();
  const isPR=prev&&(w.type==='amrap'?(r.rounds*1000+r.reps)>(prev.rounds*1000+prev.reps):r.time&&r.time<prev.time);

}

function openIntervalTool(){
  openSheet(`<div class="sheet-h"><h2>인터벌 타이머</h2><button class="link" onclick="closeSheet()">닫기</button></div>
  <div class="chips" style="margin-bottom:10px"><button class="chip" onclick="$('itW').value=20;$('itR').value=10;$('itN').value=8">타바타 20/10×8</button><button class="chip" onclick="$('itW').value=40;$('itR').value=20;$('itN').value=10">40/20×10</button><button class="chip" onclick="$('itW').value=60;$('itR').value=30;$('itN').value=6">60/30×6</button></div>
  <div class="g2"><div class="field"><label class="lbl">운동(초)</label><input class="inp" id="itW" inputmode="numeric" value="20"></div><div class="field"><label class="lbl">휴식(초)</label><input class="inp" id="itR" inputmode="numeric" value="10"></div><div class="field"><label class="lbl">라운드</label><input class="inp" id="itN" inputmode="numeric" value="8"></div></div>
  <button class="btn" onclick="closeSheet();tmOpen({kind:'tabata',title:'인터벌',work:+$('itW').value||20,rest:+$('itR').value||10,rounds:+$('itN').value||8,steps:['운동']})">시작</button>`);
}
function openPaceTool(){
  openSheet(`<div class="sheet-h"><h2>페이스 · 랩 계산</h2><button class="link" onclick="closeSheet()">닫기</button></div>
  <div class="card"><div class="chips" style="margin-bottom:8px">${[[5,'5km'],[10,'10km'],[21.0975,'하프'],[42.195,'풀']].map(([d,l])=>`<button class="chip" onclick="$('pcD').value=${d};paceCalc()">${l}</button>`).join('')}</div>
  <div class="g2"><div class="field"><label class="lbl">거리(km)</label><input class="inp" id="pcD" inputmode="decimal" value="10" oninput="paceCalc()"></div><div class="field"><label class="lbl">목표 기록 (시:분:초)</label><input class="inp" id="pcT" value="0:50:00" oninput="paceCalc('t')"></div>
  <div class="field"><label class="lbl">페이스 (분:초/km)</label><input class="inp" id="pcP" value="5:00" oninput="paceCalc('p')"></div><div class="field"><label class="lbl">트랙 한 바퀴</label><select class="inp" id="pcL" onchange="paceCalc()"><option value="400">400m</option><option value="200">200m</option><option value="1000">1km</option></select></div></div>
  <div id="pcOut" class="muted" style="line-height:1.8"></div></div>`);paceCalc();
}
function hmsToS(t){const a=String(t).trim().split(':').map(x=>parseFloat(x)||0);return a.length===3?a[0]*3600+a[1]*60+a[2]:a.length===2?a[0]*60+a[1]:a[0];}
function sToHms(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
function paceCalc(src){
  const d=num($('pcD').value);if(!(d>0))return;let p=hmsToS($('pcP').value),t=hmsToS($('pcT').value);
  if(src==='t'&&t>0){p=t/d;$('pcP').value=sToHms(p);}else{t=p*d;if(src!=='t')$('pcT').value=sToHms(t);}
  const lap=+$('pcL').value,kmh=3600/p;
  const splits=[1,5,10,21.0975,30,42.195].filter(k=>k<=d+1e-9).map(k=>`${k===21.0975?'하프':k===42.195?'풀':k+'km'} ${sToHms(p*k)}`).join(' · ');
  $('pcOut').innerHTML=`<b style="font-size:18px">${sToHms(p)}/km</b> · 시속 ${r1(kmh)}km<br>${lap}m 랩 <b>${sToHms(p*lap/1000)}</b> · 100m ${sToHms(p/10)}<br><span class="tiny">구간: ${splits}</span>`;
}

/* ══════════════════════ 설치 · 오프라인 ══════════════════════ */
let installEvt=null;
const LOGO_MARK='<path d="M344.9,181.4 A116,116 0 1 1 260.0,140.1" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round"/><circle cx="310.5" cy="153.6" r="19" fill="#ffd34d"/><path d="M200,260 L242,300 L318,216" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>';
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(curTab==='home')renderHome();if(curTab==='more')renderMore();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('홈 화면에 설치되었습니다');});
const inAppBrowser=()=>{const u=navigator.userAgent;return /KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\/|DaumApps|everytimeApp|; wv\)/i.test(u)?(/KAKAOTALK/i.test(u)?'카카오톡':/Instagram/i.test(u)?'인스타그램':/NAVER/i.test(u)?'네이버 앱':'앱 내부'):'';};
async function installApp(){
  if(installEvt&&!inAppBrowser()){installEvt.prompt();try{const c=await installEvt.userChoice;if(c&&c.outcome==='accepted'){installEvt=null;renderMore();return;}}catch(e){}installEvt=null;}
  const ib=inAppBrowser();
  openSheet(`<div class="sheet-h"><h2>홈 화면에 설치</h2><button class="link" onclick="closeSheet()">닫기</button></div>
  ${isStandalone()?'<div class="card muted">이미 앱으로 실행 중입니다.</div>':''}
  ${ib?`<div class="note n-warn" style="margin:0 0 12px"><b>${ib} 브라우저에서는 설치할 수 없습니다</b>오른쪽 위(또는 아래) 메뉴에서 "다른 브라우저로 열기" 또는 "Chrome으로 열기"를 누른 뒤 다시 설치하세요. 아이폰은 사파리로 여세요.<div style="margin-top:8px"><button class="btn sm" onclick="copyLink()">주소 복사</button></div></div>`:''}
  <div class="card"><div class="card-t" style="margin-bottom:6px">안드로이드 (크롬)</div><ol class="cues"><li>오른쪽 위 메뉴(⋮) 누르기</li><li>"앱 설치" 또는 "홈 화면에 추가" 누르기</li><li>"설치"를 고르기. "앱을 설치할 수 없음"이 뜨면 다시 메뉴 › "홈 화면에 추가" › <b>"바로가기 만들기"</b>를 고르세요. 기능은 똑같습니다.</li></ol></div>
  <div class="card"><div class="card-t" style="margin-bottom:6px">삼성 인터넷</div><ol class="cues"><li>아래 메뉴(≡) 누르기</li><li>"현재 페이지 추가" › "홈 화면"</li></ol></div>
  <div class="card"><div class="card-t" style="margin-bottom:6px">아이폰 (사파리)</div><ol class="cues"><li>사파리로 이 페이지 열기</li><li>아래쪽 공유 버튼 누르기</li><li>"홈 화면에 추가" 선택</li></ol></div>
  <div class="card"><div class="row-b" style="margin-bottom:6px"><div class="card-t">설치 진단</div><button class="btn ghost sm" onclick="runInstallCheck()">검사</button></div><div id="instChk" class="tiny">설치가 안 되면 "검사"를 눌러 빠진 파일이 있는지 확인하세요.</div></div>`);
}
function copyLink(){const u=location.href.split('#')[0];(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('주소를 복사했습니다'),()=>toast(u));}
async function runInstallCheck(){
  const out=$('instChk');out.textContent='검사 중...';const rows=[];
  const ok=(t,g,hint)=>rows.push(`<div style="display:flex;gap:8px;padding:3px 0"><b style="color:${g?'var(--good,#1a9b5b)':'var(--bad,#d0443e)'};min-width:34px">${g?'정상':'문제'}</b><span>${t}${!g&&hint?`<br><span class="muted">${hint}</span>`:''}</span></div>`);
  ok('보안 연결(https)',window.isSecureContext,'https:// 주소로 열어야 설치됩니다.');
  ok('일반 브라우저',!inAppBrowser(),'카카오톡·인스타 등 앱 안 브라우저입니다. 크롬이나 사파리로 여세요.');
  let man=null;try{const r=await fetch('manifest.json',{cache:'no-store'});ok('manifest.json',r.ok,'GitHub 저장소 맨 위에 manifest.json을 올리세요.');if(r.ok)man=await r.json();}catch(e){ok('manifest.json',false,'파일을 읽지 못했습니다.');}
  const icons=(man&&man.icons)||[{src:'icons/icon-192.png'},{src:'icons/icon-512.png'}];
  for(const ic of icons){try{const r=await fetch(ic.src,{cache:'no-store'});ok('아이콘 '+ic.src,r.ok&&/image/.test(r.headers.get('content-type')||''),'icons 폴더째로 저장소에 올리세요.');}catch(e){ok('아이콘 '+ic.src,false,'icons 폴더째로 저장소에 올리세요.');}}
  for(const f of['data/food-kr-1.tsv.gz','data/food-kr-2.tsv.gz']){try{const r=await fetch(f,{method:'HEAD',cache:'no-store'});ok('식약처 음식 DB '+f,r.ok,'data 폴더째로 저장소 맨 위에 올리세요. (폴더 없이 파일만 올렸어도 앱은 찾아 씁니다)');}catch(e){ok(f,false);}}
  try{const r=await fetch('ek.pack.gz',{method:'HEAD',cache:'no-store'});ok('운동 그림(ek.pack.gz)',r.ok,'ek.pack.gz 파일을 저장소 맨 위에 올리세요.');}catch(e){ok('ek.pack.gz',false);}
  try{const r=await fetch('sw.js',{cache:'no-store'});ok('sw.js',r.ok,'sw.js를 저장소 맨 위에 올리세요.');}catch(e){ok('sw.js',false);}
  try{const reg=await navigator.serviceWorker?.getRegistration();ok('오프라인 작동(서비스 워커)',!!(reg&&reg.active),'새로고침 후 다시 검사하세요.');}catch(e){ok('서비스 워커',false);}
  if(!isIOS())ok('크롬 설치 준비',!!installEvt||isStandalone(),'위 항목이 모두 정상인데 여기만 문제면 메뉴 › "홈 화면에 추가"로 설치하세요. 이미 설치되어 있어도 이렇게 표시됩니다.');
  out.innerHTML=rows.join('');
}
const APP_VER='6.7';
async function checkUpdate(){toast('최신 버전 확인 중...');try{const r=await navigator.serviceWorker?.getRegistration();if(r)await r.update();}catch(e){}setTimeout(()=>location.reload(),600);}
async function initPWA(){
  if('serviceWorker' in navigator){let reloaded=false;const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded&&navigator.serviceWorker.controller){reloaded=true;toast('새 버전이 적용되었습니다');}});}
  if(location.protocol.startsWith('http')&&'serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');}catch(e){}}
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist();}catch(e){}
}
