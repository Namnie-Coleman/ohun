<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오운!">
<meta name="theme-color" id="metaTheme" content="#f4f5f7">
<link rel="manifest" href="manifest.json">
<script src="firebase-config.js"></script>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="OH_UN! 오운! · 오늘 운동 완료. 운동 기록, 러닝 분석, 인바디, 식단을 한 곳에서.">
<title>OH_UN! 오운!</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--card2:#f0f1f4;--line:#e4e6ea;
  --text:#1b1d21;--text2:#5d626b;--text3:#9399a3;
  --pri:#2a78d6;--pri-soft:#e8f1fc;--pri-ink:#ffffff;
  --good:#1f9d63;--good-soft:#e5f5ec;
  --warn:#c77700;--warn-soft:#fdf2e0;
  --bad:#d64545;--bad-soft:#fbeaea;
  --s1:#2a78d6;--s2:#eb6834;
  --pri-mid:#9cc3ee;--mus:#d9dce2;--mus-base:#eef0f3;
  --r:16px;--r-sm:11px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#16171a;--card:#212327;--card2:#2a2d32;--line:#33363c;
  --text:#eef0f3;--text2:#a9aeb7;--text3:#727883;
  --pri:#3987e5;--pri-soft:#1f2f45;--pri-ink:#ffffff;
  --good:#3cb77c;--good-soft:#1c3328;
  --warn:#e09a2c;--warn-soft:#3a2f1c;
  --bad:#e66767;--bad-soft:#3d2224;
  --s1:#3987e5;--s2:#d95926;
  --pri-mid:#3f6ea6;--mus:#454a52;--mus-base:#30333a;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);}
body{color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;}
input,textarea,select{-webkit-user-select:text;user-select:text;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}

/* ── 상단 헤더 ── */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--safe-t) + 10px) 18px 8px;}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.5px;}
.top .sub{font-size:13px;color:var(--text2);margin-top:1px;}
.top-btn{font-size:14px;font-weight:600;color:var(--pri);padding:6px 4px;}

/* ── 본문 ── */
.view{display:none;padding:4px 16px calc(96px + var(--safe-b));max-width:560px;margin:0 auto;}
.view.on{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.card-t{font-size:16px;font-weight:700;}
.card-s{font-size:12px;color:var(--text3);}
.muted{color:var(--text2);font-size:13px;}
.tiny{font-size:11px;color:var(--text3);}
.sec{font-size:13px;font-weight:700;color:var(--text2);margin:18px 4px 8px;}

/* ── 세그먼트 ── */
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text2);}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
:root[data-theme="dark"] .seg button.on{background:#3a3e45;}

/* ── 칩 ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:7px 13px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;color:var(--text2);}
.chip.on{background:var(--pri);color:var(--pri-ink);}

/* ── 폼 ── */
.field{margin-bottom:12px;}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.inp,select.inp,textarea.inp{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1.5px solid transparent;border-radius:var(--r-sm);padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none;}
.inp:focus{border-color:var(--pri);background:var(--card);}
textarea.inp{resize:none;min-height:70px;}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.unit-wrap{position:relative;}
.unit-wrap .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text3);pointer-events:none;}
.unit-wrap .inp{padding-right:38px;}
input[type=range]{width:100%;accent-color:var(--pri);height:28px;}

/* ── 버튼 ── */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border-radius:13px;font-size:16px;font-weight:700;background:var(--pri);color:var(--pri-ink);}
.btn:active{opacity:.85;transform:scale(.99);}
.btn.sub{background:var(--pri-soft);color:var(--pri);}
.btn.ghost{background:var(--card2);color:var(--text);}
.btn.danger{background:var(--bad-soft);color:var(--bad);}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px;width:auto;}
.link{color:var(--pri);font-size:14px;font-weight:600;}
.row-btns{display:flex;gap:8px;}
.row-btns .btn{flex:1;}

/* ── 리스트 ── */
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;}
.li:last-child{border-bottom:none;}
.li-main{flex:1;min-width:0;}
.li-t{font-size:15px;font-weight:600;}
.li-s{font-size:12px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
.chev{color:var(--text3);font-size:18px;}
.ic{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ic svg{width:18px;height:18px;}

/* ── 스탯 ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat{background:var(--card2);border-radius:12px;padding:11px 8px;text-align:center;}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.stat span{font-size:11px;color:var(--text3);}

/* ── 배지 ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;}
.b-pri{background:var(--pri-soft);color:var(--pri);}
.b-good{background:var(--good-soft);color:var(--good);}
.b-warn{background:var(--warn-soft);color:var(--warn);}
.b-bad{background:var(--bad-soft);color:var(--bad);}
.b-pri{background:var(--pri-soft);color:var(--pri);}
.note{border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.55;margin-top:8px;}
.note b{display:block;font-size:13px;margin-bottom:2px;}
.n-good{background:var(--good-soft);} .n-good b{color:var(--good);}
.n-warn{background:var(--warn-soft);} .n-warn b{color:var(--warn);}
.n-bad{background:var(--bad-soft);} .n-bad b{color:var(--bad);}
.n-pri{background:var(--pri-soft);} .n-pri b{color:var(--pri);}

/* ── 진행바 ── */
.pb{margin-bottom:12px;}
.pb-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.pb-l span:last-child{color:var(--text2);font-variant-numeric:tabular-nums;}
.pb-bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;}
.pb-fill{height:100%;border-radius:99px;background:var(--pri);transition:width .5s ease;}

/* ── 회복 링 ── */
.ring-wrap{display:flex;align-items:center;gap:16px;}
.ring{position:relative;width:92px;height:92px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-v b{font-size:26px;font-weight:800;line-height:1;}
.ring-v span{font-size:10px;color:var(--text3);margin-top:2px;}

/* ── 운동 블록 ── */
.ex{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.ex-h{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.ex-h .inp{font-weight:700;}
.ex-tag{font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--card2);color:var(--text2);white-space:nowrap;}
.ex-tag.aux{background:var(--warn-soft);color:var(--warn);}
.set-head,.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;}
.set-head{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:4px;text-align:center;}
.set{margin-bottom:6px;}
.set-n{font-size:13px;font-weight:700;color:var(--text3);text-align:center;}
.set .inp{text-align:center;padding:9px 6px;font-weight:600;}
.x{width:34px;height:34px;border-radius:10px;color:var(--text3);font-size:18px;display:flex;align-items:center;justify-content:center;}
.x:active{background:var(--card2);}
.ex-f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.prev{font-size:12px;color:var(--text3);margin:-4px 0 8px;}

.ex-name{font-size:16px;font-weight:700;}
.chk{width:44px;height:40px;border-radius:10px;background:var(--card2);color:var(--text3);display:flex;align-items:center;justify-content:center;}
.chk svg{width:20px;height:20px;}
.set.done .chk{background:var(--good);color:#fff;}
.set.done .inp{background:var(--good-soft);color:var(--good);}
.set.done .set-n{color:var(--good);}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px;}
.chips.scroll::-webkit-scrollbar{display:none;}
.chips.scroll .chip{flex-shrink:0;}
.pk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.pk.on{background:var(--pri);border-color:var(--pri);}
.sheet-foot{position:sticky;bottom:calc(-20px - var(--safe-b));background:var(--bg);padding:10px 0 calc(10px + var(--safe-b));margin-bottom:calc(-20px - var(--safe-b));}
.step{display:flex;align-items:center;background:var(--card2);border-radius:11px;height:42px;}
.step button{width:36px;height:42px;font-size:20px;color:var(--pri);font-weight:600;}
.step b{flex:1;text-align:center;font-size:16px;font-variant-numeric:tabular-nums;}
.rest{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--safe-b));z-index:40;max-width:536px;margin:0 auto;display:none;align-items:center;gap:6px;background:var(--text);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 6px 20px rgba(0,0,0,.18);}
.rest.on{display:flex;}
body.resting .toast{bottom:calc(140px + var(--safe-b));}
body.resting .view{padding-bottom:calc(160px + var(--safe-b));}
.rest .rest-l{font-size:13px;opacity:.7;}
.rest b{flex:1;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
.rest button{font-size:13px;font-weight:700;padding:8px 9px;border-radius:10px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);}

/* ── 가이드 / 운동 모드 ── */
.gbox{background:var(--card);border-radius:var(--r);padding:10px;margin-bottom:12px;min-height:236px;}
.gbox svg{display:block;width:100%;max-height:220px;}
.cues{padding:6px 6px 6px 26px;font-size:14px;line-height:1.6;}
.cues li{margin-bottom:8px;}
.ph{width:100%;max-width:260px;aspect-ratio:1/1;margin:0 auto;}
.ph img{width:100%;height:100%;object-fit:contain;display:block;}
.bm-wrap{display:flex;justify-content:center;gap:4px;}
.bm{flex:1;max-width:170px;text-align:center;}
.bm svg{display:block;width:100%;max-height:300px;}
.bm span{font-size:11px;color:var(--text3);}
.mus-leg{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2);margin-top:6px;padding:0 6px;}
.mus-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.wm{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--safe-t) + 8px) 16px calc(18px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;}
.wm.on{display:block;}
.wm-top{display:flex;align-items:center;justify-content:space-between;}
.wm-top b{font-size:20px;font-variant-numeric:tabular-nums;}
.wm-name{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.wm-name .x{font-size:28px;width:40px;height:40px;}
.dots{display:flex;gap:5px;}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--card2);}
.dots i.on{background:var(--good);}
.step .inp{flex:1;min-width:0;text-align:center;background:transparent;padding:8px 2px;font-weight:700;border:none;}
.rest-ring{position:relative;width:210px;height:210px;margin:10px auto 16px;}
.rest-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rest-v span{font-size:13px;color:var(--text3);}
.rest-v b{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;}
body.wmode .rest,body.wmode .tabbar{display:none!important;}
.ex-name.tap{cursor:pointer;}

.ib-row{display:grid;grid-template-columns:58px 1fr 92px;gap:8px;align-items:center;margin-bottom:9px;}
.ib-l{font-size:13px;font-weight:600;}
.ib-bar{position:relative;height:14px;background:var(--card2);border-radius:4px;overflow:hidden;}
.ib-z{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 18%,transparent);}
.ib-f{position:absolute;left:0;top:4px;bottom:4px;border-radius:0 3px 3px 0;}
.ib-v{font-size:12px;color:var(--text2);text-align:right;line-height:1.25;font-variant-numeric:tabular-nums;}
.ib-v b{font-size:15px;color:var(--text);margin-right:1px;}
.ib-v span{display:block;font-size:10.5px;font-weight:700;}

.splash{position:fixed;inset:0;z-index:100;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .4s;}
.splash b{display:block;font-size:44px;font-weight:900;letter-spacing:-1px;}
.splash-logo{width:96px;height:96px;display:block;margin:0 auto 14px;}
.brand{display:inline-flex;align-items:center;gap:9px;}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b8cec,#1d5fc0);display:inline-flex;flex:none;}
.brand i svg{width:100%;height:100%;}
.splash span{font-size:15px;opacity:.85;}
.splash.off{opacity:0;pointer-events:none;}
.top h1#title{letter-spacing:-.5px;}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal i{font-style:normal;font-size:12px;line-height:30px;border-radius:9px;color:var(--text3);font-variant-numeric:tabular-nums;}
.cal i.cal-h{line-height:18px;font-size:11px;font-weight:700;}
.cal i.on{background:var(--pri);color:#fff;font-weight:700;}
.cal i.td{box-shadow:inset 0 0 0 2px var(--pri);color:var(--text);}
.cal i.on.td{color:#fff;}

/* ── 탭바 ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--text3);font-size:10.5px;font-weight:600;}
.tab svg{width:24px;height:24px;}
.tab.on{color:var(--pri);}

/* ── 시트 ── */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
.dim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.8,.3,1);padding:8px 16px calc(20px + var(--safe-b));max-width:560px;margin:0 auto;}
.sheet.on{transform:none;}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px;}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sheet-h h2{font-size:19px;font-weight:800;}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);background:#2b2e33;color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ── 차트 ── */
.chart{position:relative;width:100%;}
.chart svg{display:block;width:100%;overflow:visible;}
.chart .grid{stroke:var(--line);stroke-width:1;}
.chart .axis{fill:var(--text3);font-size:10px;font-family:var(--font);}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:2;}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:6px;}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:22px 8px;}
table.t{width:100%;border-collapse:collapse;font-size:13px;}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
table.t tr:last-child td{border-bottom:none;}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div><h1 id="title">오늘</h1><div class="sub" id="subtitle"></div></div>
    <button class="top-btn" id="topAction"></button>
  </div>
</header>

<!-- ═════════ 홈 ═════════ -->
<main class="view on" id="v-home"></main>

<!-- ═════════ 운동 ═════════ -->
<main class="view" id="v-log">
  <div class="seg" id="logSeg">
    <button class="on" data-k="weight">웨이트</button>
    <button data-k="run">러닝</button>
  </div>
  <div id="logWeight">
    <div class="card" style="padding:12px 14px">
      <div style="display:flex;gap:8px;align-items:center">
        <input class="inp" type="date" id="logDate" style="flex:1" onchange="draft.date=this.value;saveDraft()">
        <button class="btn sub sm" style="padding:11px 16px" onclick="openRoutineSheet()">루틴</button>
      </div>
      <div id="sessInfo" class="tiny" style="margin-top:8px"></div><div id="modeBtn"></div>
    </div>
    <div id="exList"></div>
    <button class="btn ghost" style="margin-bottom:12px" onclick="openPicker('log')">+ 종목 추가</button>

<script>
/* ══════════════════════ 데이터 ══════════════════════ */
const KEY='rts_app_v4';
const DEF={prog:null,profile:{name:'',height:0,weight:0,age:0,gender:'male',goal:'hypertrophy',exp:'intermediate',freq:4,rm:{squat:0,dead:0,bench:0,ohp:0,row:0}},
  logs:[],runs:[],bw:[],food:[],routines:[],customEx:[],rest:90,check:null,dietMode:'maintain',theme:'auto'};
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
  if(!S){S=structuredClone(DEF);saveLocal();}
  S={...structuredClone(DEF),...S};S.routines=S.routines.map(normRoutine);S.profile={...DEF.profile,...S.profile,rm:{...DEF.profile.rm,...(S.profile?.rm||{})}};
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('저장 공간 오류');}}
function save(){S.updatedAt=Date.now();S.dirty=1;saveLocal();if(typeof cloudQueue==='function')cloudQueue();}

/* 이전 버전(v3) 데이터 자동 이전 */
const hasOld=()=>{try{return JSON.parse(localStorage.getItem('rts_profiles')||'[]').length>0;}catch(e){return false;}};
function importOldLocal(){confirmSheet('이 기기에 있는 이전 Road to Strongman 기록을 가져올까요? 현재 프로필은 이전 프로필로 바뀝니다.',()=>{migrateOld();S.routines=(S.routines||[]).map(normRoutine);S.onb=1;save();closeSheet();go('home');toast('이전 기록을 가져왔습니다');},'가져오기',false);}
function migrateOld(){
  try{
    const ps=JSON.parse(localStorage.getItem('rts_profiles')||'[]');if(!ps.length)return;
    const uid=localStorage.getItem('rts_activeUID')||ps[0].id;
    const fromV3=convertV3({profiles:ps,logs:JSON.parse(localStorage.getItem('rts_logs')||'[]'),runLogs:JSON.parse(localStorage.getItem('rts_runlogs')||'[]'),bwLog:JSON.parse(localStorage.getItem('rts_bwlog')||'[]'),foodLog:JSON.parse(localStorage.getItem('rts_foodlog')||'[]')},uid);
    Object.assign(S,fromV3);
    const cr=JSON.parse(localStorage.getItem('rts_customRoutines')||'[]');
    S.routines=cr.map(r=>({id:r.id,name:r.name,exs:r.exercises||[]}));
  }catch(e){}
}
function convertV3(d,uid){
  const ps=d.profiles||[];const p=ps.find(x=>x.id===uid)||ps[0];if(!p)return{};
  uid=p.id;
  const mapEx=(arr,aux)=>(arr||[]).map(e=>({name:e.name||'',aux,sets:(e.sets||[]).map(s=>({w:+s.weight||0,r:+s.reps||0}))}));
  return{
    profile:{name:p.name||'',height:p.height||0,weight:p.weight||0,age:p.age||0,gender:p.gender||'male',goal:p.goal||'hypertrophy',exp:p.exp||'intermediate',freq:p.freq||4,rm:{...DEF.profile.rm,...(p.rm||{})}},
    logs:(d.logs||[]).filter(l=>l.uid===uid).map(l=>finalizeLog({id:'l'+(l.ts||Date.now())+Math.random().toString(36).slice(2,5),date:l.date,part:l.bodypart||'fullbody',memo:l.memo||'',exs:[...mapEx(l.mainExs,false),...mapEx(l.auxExs,true)],sleep:l.sleep||0,cond:l.cond||0,ts:l.ts||0})),
    runs:(d.runLogs||[]).filter(l=>l.uid===uid).map(l=>({id:'r'+(l.id||Date.now()),date:l.date,km:+l.km||0,min:+l.min||0,hr:+l.hr||0,memo:l.memo||''})),
    bw:(d.bwLog||[]).filter(e=>e.uid===uid).map(e=>({date:e.date,weight:+e.weight||0,muscle:+e.muscle||0,fat:+e.fat||0})),
    food:(d.foodLog||[]).map(f=>({id:'f'+f.id,date:f.date,name:f.name,kcal:+f.kcal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0}))
  };
}

/* ══════════════════════ 유틸 ══════════════════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const md=s=>{const [,m,d]=s.split('-');return (+m)+'/'+(+d);};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0;};
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const r1=n=>Math.round(n*10)/10;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

/* ══════════════════════ 과학 로직 ══════════════════════ */
const BIG5=[['squat','스쿼트'],['dead','데드리프트'],['bench','벤치프레스'],['ohp','오버헤드프레스'],['row','바벨로우']];
const PART_L={chest:'가슴',back:'등',legs:'하체',shoulders:'어깨',arms:'팔',core:'코어',push:'푸시',pull:'풀',fullbody:'전신',chest_tri:'가슴+삼두',chest_shoulder:'가슴+어깨',back_bi:'등+이두',legs_core:'하체+코어',rest:'휴식',cond:'컨디셔닝'};
const BPMAP={chest:'chest',chest_tri:'chest',chest_shoulder:'chest',back:'back',back_bi:'back',legs:'legs',legs_core:'legs',shoulders:'shoulders',arms:'arms',core:'core'};
const GOAL_L={hypertrophy:'근비대',strength:'근력',fat_loss:'체지방 감소',hybrid:'하이브리드(러닝 병행)',endurance:'근지구력',maintenance:'유지'};
const EXP_L={beginner:'초보 (0~1년)',intermediate:'중급 (1~3년)',advanced:'고급 (3년+)'};
const INT={hybrid:{pct:.75,rx:'5-8회 × 3-4세트'},strength:{pct:.87,rx:'3-5회 × 3-5세트'},hypertrophy:{pct:.70,rx:'8-12회 × 3-4세트'},endurance:{pct:.55,rx:'15-20회 × 2-3세트'},fat_loss:{pct:.65,rx:'12-15회 × 3-4세트'},maintenance:{pct:.70,rx:'8-12회 × 2-3세트'}};
const VOL={beginner:{chest:[6,10,14],back:[8,12,18],legs:[8,14,20],shoulders:[6,10,14],arms:[6,10,14],fullbody:[16,24,34],push:[8,12,18],pull:[8,12,18],core:[4,8,12]},
  intermediate:{chest:[8,14,20],back:[10,16,22],legs:[10,16,22],shoulders:[8,14,20],arms:[8,14,18],fullbody:[20,30,44],push:[10,14,22],pull:[10,14,22],core:[6,10,16]},
  advanced:{chest:[10,18,24],back:[12,20,26],legs:[12,18,24],shoulders:[10,16,22],arms:[10,16,22],fullbody:[24,36,54],push:[12,18,26],pull:[12,18,26],core:[8,12,18]}};

const epley=(w,r)=>r<=1?w:w*(1+r/30);
const brzycki=(w,r)=>r<=1?w:w/(1.0278-0.0278*r);
const est1RM=(w,r)=>r>12?epley(w,r):(epley(w,r)+brzycki(w,r))/2;
const round25=x=>Math.round(x/2.5)*2.5;
const bmr=p=>p.weight&&p.height&&p.age?Math.round(10*p.weight+6.25*p.height-5*p.age+(p.gender==='male'?5:-161)):0;

function recovery(c){
  let s=55;const sl=c.sleep;
  if(sl>=8.5)s+=22;else if(sl>=7)s+=14;else if(sl>=6)s+=2;else if(sl>=5)s-=14;else if(sl>0)s-=28;
  s+=(c.cond-5)*4;
  if(c.yday==='heavy')s-=12;else if(c.yday==='moderate')s-=4;else s+=5;
  return Math.max(10,Math.min(100,Math.round(s)));
}
function intensityOf(score){
  if(score>=85)return{l:'최상',d:'고중량 도전이나 최고 볼륨 세션에 좋은 날입니다.',adj:1,cls:'good'};
  if(score>=70)return{l:'좋음',d:'계획한 중량으로 정상 훈련하세요.',adj:.97,cls:'good'};
  if(score>=55)return{l:'보통',d:'권장 중량에서 5~10% 낮춰 진행하세요.',adj:.93,cls:'warn'};
  if(score>=40)return{l:'가볍게',d:'볼륨을 20%가량 줄이는 것을 권장합니다.',adj:.88,cls:'warn'};
  return{l:'회복 권장',d:'가벼운 활동이나 휴식이 더 효과적입니다.',adj:.85,cls:'bad'};
}
function volStatus(sets,part){
  const p=S.profile,t=(VOL[p.exp]||VOL.intermediate)[part]||[10,16,22],f=p.freq||4;
  const mev=Math.max(1,Math.round(t[0]/f*1.2)),mav=Math.max(2,Math.round(t[1]/f*1.2)),mrv=Math.max(3,Math.round(t[2]/f*1.2));
  if(!sets)return{cls:'pri',l:'기록 없음',d:'',mev,mav,mrv};
  if(sets<mev)return{cls:'pri',l:'볼륨 부족',d:`최소 유효 볼륨 ${mev}세트 미만입니다. 다음엔 1세트 추가하거나 중량을 2.5~5% 올려보세요.`,mev,mav,mrv};
  if(sets<=mav)return{cls:'good',l:'적정 볼륨',d:`최적 구간(${mev}~${mav}세트)입니다. 2~3주 유지 후 중량을 2.5kg 올리세요.`,mev,mav,mrv};
  if(sets<=mrv)return{cls:'warn',l:'고볼륨',d:`회복 한계(${mrv}세트)에 가깝습니다. 48~72시간 회복, 수면과 단백질을 챙기세요.`,mev,mav,mrv};
  return{cls:'bad',l:'과다 볼륨',d:`회복 한계(${mrv}세트)를 넘었습니다. 다음 세션은 20~30% 줄이세요.`,mev,mav,mrv};
}
function finalizeLog(l){
  let vol=0,sets=0;
  l.exs=l.exs.filter(e=>e.name||e.sets.length);
  l.exs.forEach(e=>{e.sets=e.sets.filter(s=>s.r>0);const tm=isTimed(e.name);e.sets.forEach(s=>{if(!tm)vol+=s.w*s.r;sets++;});});
  l.vol=Math.round(vol);l.sets=sets;return l;
}

/* ══════════════════════ 아이콘 ══════════════════════ */
const I={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  dumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-2.5 5-2.5 8h2.5v10"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>',
  calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
};

/* ══════════════════════ 탭 / 내비 ══════════════════════ */
const TABS=[['home','오늘',I.home],['log','운동',I.dumb],['hist','기록',I.chart],['diet','식단',I.food],['more','더보기',I.more]];
let curTab='home';
function renderTabbar(){$('tabbar').innerHTML=TABS.map(([k,l,ic])=>`<button class="tab ${k===curTab?'on':''}" onclick="go('${k}')">${ic}<span>${l}</span></button>`).join('');}
/* 뒤로가기 처리: 오버레이가 열리면 history 1칸, 닫히면 정리 */
let navPushed=false,navIgnore=false;
const anyOpen=()=>$('sheet').classList.contains('on')||wm.open;
function navPush(){if(!navPushed){navPushed=true;try{history.pushState({ov:1},'');}catch(e){}}}
function navPop(){setTimeout(()=>{if(navPushed&&!anyOpen()){navPushed=false;navIgnore=true;try{history.back();}catch(e){navIgnore=false;}}},350);}
window.addEventListener('popstate',()=>{
  if(navIgnore){navIgnore=false;return;}
  if(navPushed){navPushed=false;if($('sheet').classList.contains('on')){closeSheet();return;}if(wm.open){closeWM();return;}}
  if(curTab!=='home'){go('home',true);}
});
function go(k,fromPop){
  if(!fromPop&&k!=='home'&&curTab==='home'){try{history.pushState({tab:1},'');}catch(e){}}
  curTab=k;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+k));renderTabbar();
  const titles={home:'OH_UN!',log:'운동 기록',hist:'기록',diet:'식단',more:'더보기'};
  if(k==='home')$('title').innerHTML='<span class="brand"><i><svg viewBox="40 40 432 432">'+LOGO_MARK+'</svg></i>OH_UN!</span>';else $('title').textContent=titles[k];
  const d=new Date();$('subtitle').textContent=k==='home'?d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})+' · 오늘 운동, 완료!':'';
  const ta=$('topAction');ta.textContent='';ta.onclick=null;
  if(k==='home'){renderHome();if(!S.profile.weight){ta.textContent='설정';ta.onclick=openOnboarding;}}
  if(k==='log'){ta.textContent='초기화';ta.onclick=()=>confirmSheet('입력 중인 운동을 비울까요?',()=>resetLogForm());}
  if(k==='hist')renderHist();
  if(k==='diet')renderDiet();
  if(k==='more')renderMore();
  window.scrollTo(0,0);
}
function bindSeg(id,fn){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.k);});}

/* ══════════════════════ 시트 ══════════════════════ */
function openSheet(html){clearTimeout(closeSheet._t);navPush();$('sheet').innerHTML='<div class="grab"></div>'+html;$('dim').classList.add('on');$('sheet').classList.add('on');$('sheet').scrollTop=0;}
function closeSheet(){$('dim').classList.remove('on');$('sheet').classList.remove('on');navPop();clearTimeout(closeSheet._t);closeSheet._t=setTimeout(()=>{if(!$('sheet').classList.contains('on'))$('sheet').innerHTML='';},300);}
function confirmSheet(msg,ok,okLabel='확인',danger=true){
  openSheet(`<div style="font-size:17px;font-weight:700;margin:6px 0 18px;text-align:center">${esc(msg)}</div><div class="row-btns"><button class="btn ghost" onclick="closeSheet()">취소</button><button class="btn ${danger?'danger':''}" id="cfOk">${okLabel}</button></div>`);
  $('cfOk').onclick=()=>{closeSheet();ok();};
}

/* ══════════════════════ 차트 (SVG) ══════════════════════ */
function chart(el,labels,series,opt={}){
  const W=340,H=opt.h||170,pl=34,pr=8,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  const all=series.flatMap(s=>s.data.filter(v=>v!=null));if(!all.length){el.innerHTML='<div class="empty">데이터 없음</div>';return;}
  let mn=opt.bar?0:Math.min(...all),mx=Math.max(...all);
  if(!opt.bar){const pad=(mx-mn)*.15||1;mn=Math.max(0,mn-pad);mx=mx+pad;}else mx=mx*1.1||1;
  const n=labels.length,x=i=>pl+(opt.bar?(i+.5)*iw/n:(n===1?iw/2:i*iw/(n-1))),y=v=>pt+ih-(v-mn)/(mx-mn)*ih;
  let g='';
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,yy=y(v);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="axis" x="${pl-5}" y="${yy+3}" text-anchor="end">${opt.yfmt?opt.yfmt(v):v>=1000?r1(v/1000)+'k':(mx-mn)<10?r1(v):Math.round(v)}</text>`;}
  const step=Math.max(1,Math.ceil(n/6));
  labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text class="axis" x="${x(i)}" y="${H-5}" text-anchor="middle">${l}</text>`;});
  series.forEach(s=>{
    if(opt.bar){const bw=Math.max(4,Math.min(22,iw/n-4));s.data.forEach((v,i)=>{if(!v)return;const yy=y(v),h=pt+ih-yy;g+=`<path d="M${x(i)-bw/2},${pt+ih}V${yy+Math.min(4,h)}q0,-4 4,-4h${bw-8}q4,0 4,4V${pt+ih}z" fill="${s.color}"/>`;});}
    else{let d='';s.data.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+x(i)+','+y(v);});g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      s.data.forEach((v,i)=>{if(v!=null&&n<=31)g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;});}
  });
  g+=`<line id="xh" class="grid" y1="${pt}" y2="${pt+ih}" style="display:none;stroke:var(--text3)"/>`;
  const leg=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`:'';
  el.innerHTML=`${leg}<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}<rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('#xh');
  const show=ev=>{const r=svg.getBoundingClientRect(),px=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left,vx=px/r.width*W;
    let i=opt.bar?Math.floor((vx-pl)/iw*n):Math.round((vx-pl)/iw*(n-1));i=Math.max(0,Math.min(n-1,i));
    const lines=series.map(s=>s.data[i]!=null?`${series.length>1?s.name+' ':''}${opt.fmt?opt.fmt(s.data[i]):s.data[i]}`:null).filter(Boolean);if(!lines.length)return;
    tip.innerHTML=`${labels[i]}<br>${lines.join('<br>')}`;tip.style.display='block';tip.style.left=(x(i)/W*r.width)+'px';
    const top=Math.min(...series.map(s=>s.data[i]!=null?y(s.data[i]):H));tip.style.top=(top/H*r.height)+'px';
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.display='';};
  const hide=()=>{tip.style.display='none';xh.style.display='none';};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide);svg.addEventListener('touchend',()=>setTimeout(hide,1500));
}

function renderHome(){

  const wk=S.logs.filter(l=>l.date>=daysAgo(6));
  const wkVol=wk.reduce((s,l)=>s+l.vol,0),wkRun=S.runs.filter(r=>r.date>=daysAgo(6)).reduce((s,r)=>s+r.km,0);

      <div class="ring-wrap"><div class="ring"><svg width="92" height="92"><circle cx="46" cy="46" r="40" fill="none" stroke="var(--card2)" stroke-width="9"/><circle cx="46" cy="46" r="40" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-sc/100)}"/></svg><div class="ring-v"><b>${sc}</b><span>회복 지수</span></div></div>

    h+=`<div class="card"><div class="card-t" style="margin-bottom:4px">오늘 컨디션 체크</div><div class="muted" style="margin-bottom:12px">수면과 컨디션으로 오늘 운동 강도를 정합니다.</div><button class="btn" onclick="openCheck()">30초 체크하기</button></div>`;
  }
  // 오늘의 운동
  {const rs=S.routines.length?S.routines.map((r,i)=>['mine',i,r]):(S.profile.weight?recRoutines():[0,1,2,3]).map(i=>['preset',i,PRESETS[i]]);
   const td=draft.exs.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),tt=draft.exs.reduce((a,e)=>a+e.sets.length,0);
   const tr=todayRoutine();if(tr>=0&&!draft.exs.length){const r=S.routines[tr];rs.sort((a,b)=>(b[0]==='mine'&&b[1]===tr)-(a[0]==='mine'&&a[1]===tr));}
   h+=`<div class="card"><div class="card-h"><div class="card-t">오늘의 운동</div><button class="link" onclick="openRoutineSheet()">루틴 관리</button></div>

  {const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
   const key=d=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

function plates(w){if(!(w>20))return'';let side=(w-20)/2;const out=[];for(const p of[25,20,15,10,5,2.5,1.25]){while(side>=p-1e-9){out.push(p);side-=p;}}return out.length?`한쪽 원판 ${out.join(' + ')} (바 20kg)${side>.01?' · 정확히 맞출 수 없는 무게':''}`:'';}

let restEnd=0,restInt=null;
function startRest(sec){
  sec=sec??S.rest;if(!sec)return;restEnd=Date.now()+sec*1000;
  const el=$('rest');el.innerHTML=`<span class="rest-l">휴식</span><b id="restT"></b><button onclick="restEnd-=15000;tickRest()">−15초</button><button onclick="restEnd+=15000;tickRest()">+15초</button><button onclick="restEnd=0;tickRest()">건너뛰기</button>`;
  el.classList.add('on');document.body.classList.add('resting');clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest();
}
function tickRest(){
  const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){clearInterval(restInt);$('rest').classList.remove('on');document.body.classList.remove('resting');if(restEnd&&left>-2){try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}toast('휴식 끝 · 다음 세트');}return;}
  $('restT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}

function saveWorkout(){
  const log=finalizeLog({id:uid('l'),date:$('logDate').value||today(),memo:$('logMemo').value.trim(),
    exs:draft.exs.map(e=>({name:e.name,sets:e.sets.map(s=>({w:num(s.w),r:Math.round(num(s.r))}))})),ts:Date.now()});
  if(draft.startedAt)log.dur=Math.max(1,Math.round((Date.now()-draft.startedAt)/60000));
  if(!log.sets){toast('세트를 1개 이상 입력하세요');return;}
  const undone=draft.exs.reduce((a,e)=>a+e.sets.filter(s=>!s.done&&num(s.r)).length,0);
  const pc={};log.exs.forEach(e=>{const p=partOf(e.name);if(p)pc[p]=(pc[p]||0)+e.sets.length;});
  log.part=Object.keys(pc).sort((a,b)=>pc[b]-pc[a])[0]||'fullbody';log.parts=Object.keys(pc);
  if(S.check&&S.check.date===log.date){log.sleep=S.check.sleep;log.cond=S.check.cond;log.score=S.check.score;}
  const exist=S.logs.find(l=>l.date===log.date);
  const doSave=()=>{restEnd=0;tickRest();S.logs=S.logs.filter(l=>l.date!==log.date);S.logs.push(log);S.logs.sort((a,b)=>a.date.localeCompare(b.date));save();
    window._lastDraft=structuredClone(draft);showResult(log);resetLogForm();};
  const go2=()=>exist?confirmSheet(`${md(log.date)} 기록이 이미 있어요. 덮어쓸까요?`,doSave,'덮어쓰기'):doSave();
  if(undone)confirmSheet(`완료 체크 안 한 세트 ${undone}개도 기록에 포함됩니다. 저장할까요?`,go2,'저장',false);else go2();
}
function prList(log){
  const out=[];BIG5.forEach(([k,n])=>{const e=log.exs.find(x=>x.name===n);if(!e)return;const best=Math.max(0,...e.sets.filter(s=>s.w&&s.r&&s.r<=12).map(s=>est1RM(s.w,s.r)));if(best)out.push({k,n,est:r1(best),cur:S.profile.rm[k]||0});});return out;
}

  const prs=prList(log),max=Math.max(1,...log.exs.map(e=>e.sets.reduce((s,x)=>s+x.w*x.r,0)));

  <div class="card"><div class="card-t" style="margin-bottom:10px">종목별 볼륨</div>${log.exs.map(e=>{const v=e.sets.reduce((s,x)=>s+x.w*x.r,0);return`<div class="pb"><div class="pb-l"><span>${esc(e.name)} <span class="tiny">${e.sets.length}세트</span></span><span>${fmt(v)} kg</span></div><div class="pb-bar"><div class="pb-fill" style="width:${v/max*100}%"></div></div></div>`;}).join('')}</div>

const RT_L={easy:'이지',tempo:'템포',interval:'인터벌',long:'롱런',race:'레이스'};let runT='easy';
function renderRunType(){$('runType').innerHTML=Object.entries(RT_L).map(([k,l])=>`<button class="chip ${runT===k?'on':''}" onclick="runT='${k}';renderRunType()">${l}</button>`).join('');}
const secStr=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');};
function runBest(){let b=null;S.runs.filter(r=>r.km>=3&&r.min&&r.date>=daysAgo(120)).forEach(r=>{const t5=r.min*60*Math.pow(5/r.km,1.06);if(!b||t5<b.t5)b={r,t5};});return b;}
function paceStr(km,min){if(!km||!min)return'';const s=min*60/km;return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');}
function runPaceLive(){$('runPace').value=paceStr(num($('runKm').value),num($('runMin').value));}
function saveRun(){
  const r={id:uid('r'),date:$('runDate').value||today(),type:runT,km:num($('runKm').value),min:num($('runMin').value),hr:Math.round(num($('runHr').value)),memo:$('runMemo').value.trim(),link:($('runLink').value.trim().match(/^https?:\/\/\S+/)||[''])[0]};

  ['runKm','runMin','runHr','runMemo','runPace','runLink'].forEach(id=>$(id).value='');
  const wk=S.runs.filter(x=>x.date>=daysAgo(6)).reduce((s,x)=>s+x.km,0),prev=S.runs.filter(x=>x.date>=daysAgo(13)&&x.date<daysAgo(6)).reduce((s,x)=>s+x.km,0);
  const maxHr=S.profile.age?Math.round(208-.7*S.profile.age):0,pct=r.hr&&maxHr?Math.round(r.hr/maxHr*100):0;
  const zn=pct?(pct<60?'Z1 회복':pct<70?'Z2 지방 연소':pct<80?'Z3 유산소':pct<90?'Z4 역치':'Z5 최대'):'';
  openSheet(`<div class="sheet-h"><h2>러닝 완료</h2><button class="link" onclick="closeSheet()">닫기</button></div>
  <div class="card"><div class="stats"><div class="stat"><b>${r.km}</b><span>km</span></div><div class="stat"><b>${paceStr(r.km,r.min)||'-'}</b><span>페이스 /km</span></div><div class="stat"><b>${r1(wk)}</b><span>이번 주 km</span></div></div>
  ${zn?`<div class="note n-pri"><b>심박 구간 ${zn}</b>평균 ${r.hr}bpm, 최대 심박의 약 ${pct}%</div>`:''}
  ${prev&&wk/prev>1.3?`<div class="note n-bad"><b>주간 거리 급증 (${Math.round(wk/prev*100)}%)</b>지난주 ${r1(prev)}km 대비 크게 늘었습니다. 주간 증가는 10% 이내가 안전합니다.</div>`:''}
  ${(()=>{const b=runBest();return b&&b.r.id===r.id?`<div class="note n-good"><b>최근 최고 기록</b>이 기록 기준 5K 예상 ${hms(b.t5)} · 기록 탭에서 예상 기록과 페이스 구간을 확인하세요.</div>`:'';})()}</div>`);
}

function deloadInfo(){
  const L=S.logs;if(L.length<4)return null;
  const weeks=[0,1,2,3].map(i=>L.filter(l=>l.date<=daysAgo(i*7)&&l.date>daysAgo(i*7+7)));
  const vols=weeks.map(w=>w.reduce((s,l)=>s+l.vol,0));
  const recent=L.slice(-8),conds=recent.filter(l=>l.cond),sleeps=recent.filter(l=>l.sleep);
  const cond=conds.length?r1(conds.reduce((s,l)=>s+l.cond,0)/conds.length):0,sleep=sleeps.length?sleeps.reduce((s,l)=>s+l.sleep,0)/sleeps.length:7;
  let sc=0;if(cond&&cond<5)sc+=30;else if(cond&&cond<7)sc+=15;if(sleep<6)sc+=25;else if(sleep<7)sc+=10;
  if(vols[0]<Math.max(...vols)*.7&&vols[0]<vols[3])sc+=25;
  const weeksOn=weeks.filter(w=>w.length).length;if(weeksOn>=4)sc+=20;
  if(sc>=70)return{score:sc,cond,weeks:weeksOn,cls:'bad',l:'디로드 필요',d:'5~7일간 세트 수를 절반으로, 중량을 1RM의 60~70%로 낮추고 수면 8시간을 확보하세요. 복귀 후 80% → 90% → 100%로 올립니다.'};
  if(sc>=50)return{score:sc,cond,weeks:weeksOn,cls:'warn',l:'디로드 시점',d:'피로가 쌓이고 있습니다. 이번 주 또는 다음 주에 볼륨 40~60% 축소 주간을 넣어보세요.'};
  return{score:sc,cond,weeks:weeksOn,cls:'good',l:'정상 훈련',d:'현재 강도를 유지하면서 점진적 과부하를 이어가세요. 4~6주 고강도 후 1주 디로드가 기본 주기입니다.'};
}

function ibStd(){
  const p=S.profile;if(!p.height)return null;const h=p.height/100,m=p.gender!=='female';
  const sw=(m?22:21)*h*h,sp=m?.15:.23,sf=sw*sp,ssm=(sw-sf)*(m?.577:.553);
  return{h,m,sw,sf,ssm,pbfR:m?[10,20]:[18,28]};
}
const IB_T={w:[55,70,85,100,115,130,145,160,175,190,205],m:[70,80,90,100,110,120,130,140,150,160,170],f:[40,60,80,100,160,220,280,340,400,460,520]};
function ibX(k,v){const t=IB_T[k];if(v<=t[0])return 0;for(let i=1;i<t.length;i++)if(v<=t[i])return(i-1+(v-t[i-1])/(t[i]-t[i-1]))/(t.length-1)*100;return 100;}
function ibBar(lbl,val,std,lo,hi,unit,k){
  const pct=val/std*100,x=v=>ibX(k,v);
  const st=pct<lo?'표준 이하':pct>hi?'표준 이상':'표준',c=pct<lo?'var(--warn)':pct>hi?'var(--bad)':'var(--good)';
  return`<div class="ib-row"><div class="ib-l">${lbl}</div><div class="ib-bar"><i class="ib-z" style="left:${x(lo)}%;width:${x(hi)-x(lo)}%"></i><i class="ib-f" style="width:${x(pct)}%;background:${c}"></i></div><div class="ib-v"><b>${r1(val)}</b>${unit}<span style="color:${c}">${st}</span></div></div>`;
}
function inbodyHTML(){
  const L=S.bw.filter(e=>e.muscle&&e.fat),e=L.at(-1),pv=L.at(-2),sd=ibStd();
  if(!e)return`<div class="card"><div class="card-t" style="margin-bottom:4px">인바디 분석</div><div class="muted">인바디 결과지의 체중·골격근량·체지방량을 입력하면 체형 분석이 나옵니다.</div></div>`;
  if(!sd)return`<div class="card"><div class="card-t" style="margin-bottom:6px">인바디 분석</div><div class="muted" style="margin-bottom:10px">분석에는 키와 성별이 필요합니다.</div><button class="btn sub" onclick="openProfile()">프로필 입력</button></div>`;
  const wP=e.weight/sd.sw*100,mP=e.muscle/sd.ssm*100,fP=e.fat/sd.sf*100,pbf=r1(e.fat/e.weight*100),bmi=r1(e.weight/(sd.h*sd.h));
  const lbm=e.weight-e.fat,ffmi=r1(lbm/(sd.h*sd.h)+6.1*(1.8-sd.h)),bmr=e.bmr||Math.round(370+21.6*lbm);
  let type,tc,tip;
  const xw=ibX('w',wP),xm=ibX('m',mP),xf=ibX('f',fP);
  if(xm>xw+3&&xm>xf+3){type='D형 · 근육형';tc='good';tip='골격근량이 체중보다 상대적으로 많은 이상적인 체형입니다. 현재 근육량을 유지하며 체지방률만 관리하세요.';}
  else if(xm<xw-3&&xm<xf-3){type='C형 · 근육 부족형';tc='bad';tip='체지방 대비 근육량이 부족합니다. 주 3회 이상 근력운동과 체중 1kg당 단백질 1.6~2.2g 섭취, 완만한 칼로리 적자를 권장합니다.';}
  else{type='I형 · 균형형';tc='pri';tip='체중·근육·지방 막대가 비슷한 길이인 균형형입니다. 체지방은 유지하거나 줄이면서 골격근량을 늘리면 D형(근육형)이 됩니다.';}
  const fatCtl=r1(Math.min(0,(lbm*sd.pbfR[1]/100/(1-sd.pbfR[1]/100))-e.fat)),musCtl=r1(Math.max(0,sd.ssm-e.muscle)),pbfC=pbf<sd.pbfR[0]?'warn':pbf>sd.pbfR[1]?'bad':'good';

/* 워치 파일 파싱 (TCX / GPX) */
function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const tagN=(el,n)=>[...el.getElementsByTagName('*')].filter(x=>x.localName===n);
const firstN=(el,n)=>{const x=tagN(el,n)[0];return x?x.textContent.trim():'';};
function parseTrack(pts){
  // pts: [{t:ms,d:m|null,hr,cad,ele,ll:[lat,lon]}]
  pts=pts.filter(p=>p.t);if(pts.length<2)return null;
  let d=0;pts.forEach((p,i)=>{if(p.d==null){if(i&&p.ll&&pts[i-1].ll)d+=hav(pts[i-1].ll,p.ll);p.d=d;}else d=p.d;});
  const dist=pts.at(-1).d-pts[0].d,dur=(pts.at(-1).t-pts[0].t)/1000;
  const hrs=pts.filter(p=>p.hr),cads=pts.filter(p=>p.cad);let gain=0;pts.forEach((p,i)=>{if(i&&p.ele!=null&&pts[i-1].ele!=null&&p.ele>pts[i-1].ele)gain+=p.ele-pts[i-1].ele;});
  const splits=[];let km=1,lastT=pts[0].t;for(const p of pts){if(p.d-pts[0].d>=km*1000){splits.push(Math.round((p.t-lastT)/1000));lastT=p.t;km++;}}
  return{dist,dur,start:pts[0].t,hr:hrs.length?Math.round(hrs.reduce((a,p)=>a+p.hr,0)/hrs.length):0,hrMax:hrs.length?Math.max(...hrs.map(p=>p.hr)):0,
    cad:cads.length?Math.round(cads.reduce((a,p)=>a+p.cad,0)/cads.length):0,gain:Math.round(gain),splits};
}
function parseRunFile(text,name){
  const x=new DOMParser().parseFromString(text,'application/xml');if(x.getElementsByTagName('parsererror').length)throw new Error('파일 형식 오류');
  const root=x.documentElement.localName;let pts=[],kcal=0,sport='';
  if(root==='TrainingCenterDatabase'){
    sport=(tagN(x,'Activity')[0]||{getAttribute:()=>''}).getAttribute('Sport')||'';
    tagN(x,'Lap').forEach(l=>kcal+=num(firstN(l,'Calories')));
    tagN(x,'Trackpoint').forEach(tp=>{const lat=firstN(tp,'LatitudeDegrees'),dm=firstN(tp,'DistanceMeters'),hrEl=tagN(tp,'HeartRateBpm')[0];
      pts.push({t:Date.parse(firstN(tp,'Time')),d:dm?num(dm):null,hr:hrEl?num(firstN(hrEl,'Value')):0,cad:num(firstN(tp,'RunCadence')||firstN(tp,'Cadence'))*2||0,ele:firstN(tp,'AltitudeMeters')?num(firstN(tp,'AltitudeMeters')):null,ll:lat?[num(lat),num(firstN(tp,'LongitudeDegrees'))]:null});});
    if(pts.every(p=>!p.cad))pts.forEach(p=>p.cad=0);
  }else if(root==='gpx'){
    sport=firstN(x,'type');
    tagN(x,'trkpt').forEach(tp=>{const c=num(firstN(tp,'cad'));pts.push({t:Date.parse(firstN(tp,'time')),d:null,hr:num(firstN(tp,'hr')),cad:c?c*2:0,ele:firstN(tp,'ele')?num(firstN(tp,'ele')):null,ll:[num(tp.getAttribute('lat')),num(tp.getAttribute('lon'))]});});
  }else throw new Error('TCX/GPX 파일이 아닙니다');
  const r=parseTrack(pts);if(!r||r.dist<100)throw new Error('거리 정보가 없습니다');
  const dt=new Date(r.start);dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());
  // 케이던스가 이미 양발 기준(>130)이면 2배 보정 취소
  let cad=r.cad;if(cad>260)cad=Math.round(cad/2);
  return{id:uid('r'),date:dt.toISOString().slice(0,10),type:'easy',km:r1(r.dist/1000*100)/100,min:r1(r.dur/60),hr:r.hr,hrMax:r.hrMax,cad,gain:r.gain,kcal:Math.round(kcal)||0,splits:r.splits,memo:name.replace(/\.(tcx|gpx)$/i,''),src:'watch',start:r.start};
}
async function importRunFiles(ev){
  const files=[...ev.target.files];ev.target.value='';if(!files.length)return;let ok=0,dup=0,fail=[];
  for(const f of files){try{const r=parseRunFile(await f.text(),f.name);r.km=Math.round(r.km*100)/100;
      if(S.runs.some(x=>x.start&&x.start===r.start)){dup++;continue;}S.runs.push(r);ok++;window._lastRun=r.id;}catch(e){fail.push(f.name+': '+e.message);}}
  S.runs.sort((a,b)=>a.date.localeCompare(b.date));save();
  toast(`가져옴 ${ok}건${dup?` · 중복 ${dup}`:''}${fail.length?` · 실패 ${fail.length}`:''}`);
  if(fail.length)openSheet(`<div class="sheet-h"><h2>일부 실패</h2><button class="link" onclick="closeSheet()">닫기</button></div><div class="card muted">${fail.map(esc).join('<br>')}</div>`);
  else if(ok===1)openRun(window._lastRun);
}
function garminHelp(){

function saveOnboarding(){
  const p=S.profile,w=num($('obW').value),h=num($('obH').value),a=Math.round(num($('obA').value));

  Object.assign(p,{name:$('obN').value.trim(),gender:ob.gender,age:a,height:h,weight:w,goal:ob.goal,exp:ob.exp,freq:+ob.freq});
  const m=num($('obM').value),fa=num($('obF').value);
  if(m&&fa&&fa<w){S.bw=S.bw.filter(x=>x.date!==today());S.bw.push({date:today(),weight:w,muscle:m,fat:fa,vf:0,bmr:0});S.bw.sort((x,y)=>x.date.localeCompare(y.date));p.fatpct=r1(fa/w*100);}

function recRoutines(){
  const p=S.profile,n=x=>PRESETS.findIndex(r=>r.name===x),out=[];
  if(p.goal==='hybrid'||p.goal==='endurance')out.push(n('하이브리드 A · 하체 근력 + 이지런'),n('하이브리드 C · 상체 근력 + 템포'),n('하이브리드 B · 인터벌 + 코어'));
  else if(p.gender==='female')out.push(...(p.exp==='beginner'?[n('여성 전신 (초급 · 주 3회)'),n('여성 하체 · 둔근 A')]:[n('여성 하체 · 둔근 A'),n('여성 상체 · 코어'),n('여성 하체 · 둔근 B')]));
  else if(p.goal==='fat_loss')out.push(n('전신 A (초급)'),n('하이브리드 D · 전신 컨디셔닝'),n('하이브리드 A · 하체 근력 + 이지런'));
  else if(p.exp==='beginner')out.push(n('전신 A (초급)'),n('상체 (초급 2분할)'),n('하체 (초급 2분할)'));

  return out.filter(i=>i>=0);
}

function mergeIn(d){

  S.logs=by(S.logs,d.logs,x=>x.date);S.bw=by(S.bw,d.bw,x=>x.date);S.runs=by(S.runs,d.runs,x=>x.id);S.food=by(S.food,d.food,x=>x.id);

  (d.customEx||[]).forEach(x=>{if(!S.customEx.some(y=>y.name===x.name))S.customEx.push(x);});

/* ══════════════════════ 계정 · 클라우드 동기화 (Firebase) ══════════════════════
   데이터는 기기(localStorage)에 먼저 저장되고, 로그인하면 Firebase Realtime Database
   users/{uid}/ohun 에 자동 업로드된다. 구성 값은 firebase-config.js 에서 읽는다. 다른 기기에서 로그인하면 내려받아 합친다. */
const FB_CFG=window.OHUN_FIREBASE||null;
const fb={ready:false,user:null,busy:false,t:null,state:'',err:''};
const loadJS=src=>new Promise((res,rej)=>{const x=document.createElement('script');x.src=src;x.onload=res;x.onerror=()=>rej(new Error('네트워크'));document.head.appendChild(x);});
async function fbInit(){
  if(fb.ready)return true;
  if(!FB_CFG||!FB_CFG.apiKey||/여기/.test(FB_CFG.apiKey)||!FB_CFG.databaseURL){fb.err='클라우드 설정이 아직 없습니다. firebase-config.js에 Firebase 구성 값을 넣어주세요.';acctRefresh();return false;}
  try{const v='10.12.2',b=`https://www.gstatic.com/firebasejs/${v}/`;
    if(!window.firebase){await loadJS(b+'firebase-app-compat.js');await loadJS(b+'firebase-auth-compat.js');await loadJS(b+'firebase-database-compat.js');}
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
    fb.auth=firebase.auth();fb.db=firebase.database();
    await fb.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    fb.auth.getRedirectResult().catch(e=>{fb.err=authMsg(e);});
    fb.auth.onAuthStateChanged(u=>{fb.user=u;if(u){S.cloud=1;saveLocal();syncNow();}acctRefresh();});
    fb.ready=true;return true;
  }catch(e){fb.err='Firebase에 연결하지 못했습니다. 인터넷을 확인하세요.';acctRefresh();return false;}
}
function authMsg(e){const c=e&&e.code||'';return({'auth/popup-closed-by-user':'로그인 창이 닫혔습니다.','auth/popup-blocked':'팝업이 차단되었습니다.','auth/invalid-credential':'이메일 또는 비밀번호가 맞지 않습니다.','auth/wrong-password':'비밀번호가 맞지 않습니다.','auth/user-not-found':'가입된 이메일이 아닙니다. 가입하기를 누르세요.','auth/email-already-in-use':'이미 가입된 이메일입니다. 로그인하세요.','auth/weak-password':'비밀번호는 6자 이상이어야 합니다.','auth/invalid-email':'이메일 형식이 맞지 않습니다.','auth/unauthorized-domain':'이 주소가 Firebase 승인 도메인에 없습니다. 콘솔에서 추가하세요.','auth/network-request-failed':'네트워크 오류입니다.'}[c])||(e&&e.message)||'오류가 발생했습니다.';}
async function loginGoogle(){
  if(!(await fbInit()))return;fb.err='';const p=new firebase.auth.GoogleAuthProvider();
  try{if(isStandalone()&&isIOS())await fb.auth.signInWithRedirect(p);else await fb.auth.signInWithPopup(p);}
  catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)){try{await fb.auth.signInWithRedirect(p);return;}catch(e2){fb.err=authMsg(e2);}}else fb.err=authMsg(e);acctRefresh();}

async function syncNow(manual){
  if(!fb.user||fb.busy)return;fb.busy=true;fb.state='동기화 중';acctRefresh();
  try{
    const ref=fb.db.ref(`users/${fb.user.uid}/ohun`),snap=await ref.get(),r=snap.val();
    let push=false;
    const rU=r&&r.json?(r.updatedAt||0):0,changed=rU&&rU!==(S.syncedRemote||0),dirty=!!S.dirty;
    if(r&&r.json){
      const remote=JSON.parse(r.json);
      if(changed&&dirty){mergeIn(remote);push=true;if(manual!=='silent')toast('다른 기기 기록과 합쳤습니다');}
      else if(changed){const keep={theme:S.theme,hideInstall:S.hideInstall,cloud:1};S={...structuredClone(DEF),...remote,...keep};S.routines=(S.routines||[]).map(normRoutine);S.dirty=0;S.syncedRemote=rU;applyTheme();if(manual!=='silent')toast('클라우드 기록을 불러왔습니다');}
      else push=dirty;
    }else{
      push=true;
      const old=(await fb.db.ref(`users/${fb.user.uid}`).get()).val();
      if(old&&(old.logs||old.profiles)&&!S.oldCloudAsked){S.oldCloudAsked=1;
        const d={profiles:arrOf(old.profiles),logs:arrOf(old.logs),runLogs:arrOf(old.runLogs),bwLog:arrOf(old.bwLog),foodLog:arrOf(old.foodLog)};
        setTimeout(()=>confirmSheet(`이전 Road to Strongman 클라우드에서 운동 ${d.logs.length}건을 찾았습니다. 가져올까요?`,()=>{mergeIn(convertV3(d));save();go(curTab);toast('이전 기록을 가져왔습니다');},'가져오기',false),300);}
    }
    if(push){const t=Date.now();S.dirty=0;S.updatedAt=t;S.syncedRemote=t;await ref.set({json:JSON.stringify(S),updatedAt:t,device:navigator.userAgent.slice(0,80)});}
    saveLocal();fb.state='완료 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});fb.err='';
    if(changed&&!push||changed&&dirty)go(curTab);
  }catch(e){fb.state='실패';fb.err=e.code==='PERMISSION_DENIED'||/permission/i.test(e.message)?'데이터베이스 권한이 없습니다. 보안 규칙을 확인하세요.':'동기화 실패: '+(e.message||'');}
  fb.busy=false;acctRefresh();
}

/* ══════════════════════ 프로그램 (요일·주차 플랜) ══════════════════════ */
// 1RM(프로필) 기준으로 주차별 중량을 자동 계산. 1RM이 없으면 기록에서 추정.
const PK_NAME={squat:'스쿼트',bench:'벤치프레스',dead:'데드리프트',ohp:'오버헤드프레스',row:'바벨로우'};
function rmOf(k){
  const v=S.profile.rm[k];if(v>0)return v;
  const n=PK_NAME[k];let best=0;S.logs.slice(-60).forEach(l=>l.exs.forEach(e=>{if(e.name===n)e.sets.forEach(s=>{const w=num(s.w),r=num(s.r);if(w>0&&r>0&&r<=12)best=Math.max(best,est1RM(w,r));});}));
  return best;
}
const RD=x=>x>0?round25(x):'';
const isLow=k=>k==='squat'||k==='dead';
const rampS=(t,ms,r)=>ms.map(m=>[RD(t*m),r]);
const pctS=(k,list,base)=>{const b=base!=null?base:rmOf(k);return list.map(([p,r,a])=>[RD(b*p),r,a]);};
const RUN_PACE={이지런:375,템포런:330,롱런:375,'인터벌 런':300};
// 아이템: {n, s, r, w} 고정 / {n, f:(w)=>[[kg,reps,amrap]...]} 계산 / {n, km} 러닝
function itemSets(it,w){
  if(it.f)return it.f(w).map(([kg,r,a])=>({w:kg,r,a:!!a}));
  if(it.km)return[{w:'',r:Math.round(it.km*(RUN_PACE[it.n]||360)/60)*60,km:it.km}];
  return Array.from({length:it.s||3},()=>({w:it.w||'',r:it.r||10}));

const PROG_LV={all:'전체',beg:'초급',mid:'중급',adv:'상급'};let progLv='all';

const progById=id=>PROGRAMS.find(p=>p.id===id);
const dayT=(d,w)=>(d.tw&&d.tw(w))||(typeof d.t==='function'?d.t(w):d.t);
const dayItems=(d,w)=>(typeof d.items==='function'?d.items(w):d.items)||[];
function mondayOf(dt){const d=new Date(dt);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function progWeek(){const sp=S.prog;if(!sp)return 0;const p=progById(sp.id);if(!p)return 0;const w=Math.floor((mondayOf(new Date())-new Date(sp.start))/(7*864e5))+1+(sp.off||0);return Math.max(1,Math.min(p.weeks,w));}
function progToday(){const sp=S.prog,p=sp&&progById(sp.id);if(!p)return null;const wd=new Date().getDay(),di=p.sched.indexOf(wd);return{p,w:progWeek(),di,day:di>=0?p.days[di]:null};}
function missingRM(p){return p.keys.filter(k=>!rmOf(k));}

}

    for(let w=1;w<=p.weeks;w++){
      let cells='';
      if(lifts)cells=lifts.map(k=>{let best=null;p.days.forEach(d=>dayItems(d,w).forEach(it=>{if(it.n===PK_NAME[k]&&it.f)it.f(w).forEach(([kg,r])=>{if(kg&&(!best||kg>best[0]))best=[kg,r];});}));return`<td style="text-align:right;padding:6px 4px;white-space:nowrap">${best?best[0]+'×'+best[1]:'-'}</td>`;}).join('');
      else cells=NNM_RUN[w-1].map(x=>`<td style="text-align:right;padding:6px 4px">${x}km</td>`).join('');

function saveProgRM(id){const p=progById(id);missingRM(p).forEach(k=>{const v=num($('prm_'+k)?.value);if(v>0)S.profile.rm[k]=v;});save();openProgram(id);toast('1RM 저장됨');}
function beginProg(id){const go2=()=>{S.prog={id,start:mondayOf(new Date()).toISOString().slice(0,10),off:0};save();closeSheet();go('home');toast(progById(id).name+' 시작');};
  if(S.prog&&S.prog.id!==id)confirmSheet(`진행 중인 ${progById(S.prog.id)?.name||'프로그램'}을 그만두고 바꿀까요?`,go2,'바꾸기',false);else go2();}
function shiftProg(d){const p=progById(S.prog.id);const w=progWeek()+d;if(w<1||w>p.weeks)return;S.prog.off=(S.prog.off||0)+d;save();openProgram(p.id,pv.tab,progWeek());}
function stopProg(){confirmSheet('프로그램을 그만둘까요? 기록은 그대로 남습니다.',()=>{S.prog=null;save();closeSheet();go('home');},'그만하기');}
function startProgDay(id,di,w){
  const p=progById(id),d=p.days[di],its=dayItems(d,w);
  const doIt=()=>{draft.exs=its.map(it=>({id:uid('e'),name:it.n,up:0,sets:itemSets(it,w).map(s=>({w:s.w===''?'':s.w,r:s.r,done:false}))}));
    draft.routine=`${p.name} ${w}주 · ${dayT(d,w)}`;draft.startedAt=0;saveDraft();closeSheet();if(curTab!=='log')go('log');renderExList();openWM();};
  if(draft.exs.length)confirmSheet('입력 중인 운동을 이 계획으로 바꿀까요?',doIt,'바꾸기');else doIt();
}
function progHomeHTML(){
  const t=progToday();if(!t)return'';const{p,w,di,day}=t;
  let nx='';if(!day){for(let k=1;k<=7;k++){const wd=(new Date().getDay()+k)%7,i=p.sched.indexOf(wd);if(i>=0){nx=`다음: ${WD[wd]}요일 · ${dayT(p.days[i],w)}`;break;}}}
  const its=day?dayItems(day,w):[];
  return`<div class="card"><div class="card-h"><div class="card-t">${esc(p.name)} · ${w}/${p.weeks}주</div><button class="link" onclick="openProgram('${p.id}','day',${w})">전체 보기</button></div>
  <div class="tiny" style="margin-bottom:10px">${esc(p.weekNote?p.weekNote(w):'')}</div>
  ${day&&its.length?`<div class="muted" style="margin-bottom:8px">${esc(dayT(day,w))}</div><div style="margin-bottom:10px">${its.slice(0,6).map(it=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0"><span>${esc(it.n)}</span><span class="tiny">${setsLabel(it,w)}</span></div>`).join('')}${its.length>6?`<div class="tiny">외 ${its.length-6}종목</div>`:''}</div>
   <button class="btn" onclick="startProgDay('${p.id}',${di},${w})">오늘 운동 시작</button>`:`<div class="muted">오늘은 휴식입니다. ${nx}</div>`}</div>`;
}

/* ══════════════════════ 설치 · 오프라인 ══════════════════════ */
let installEvt=null;
const LOGO_MARK='<path d="M344.9,181.4 A116,116 0 1 1 260.0,140.1" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round"/><circle cx="310.5" cy="153.6" r="19" fill="#ffd34d"/><path d="M200,260 L242,300 L318,216" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>';
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(curTab==='home')renderHome();if(curTab==='more')renderMore();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('홈 화면에 설치되었습니다');});
const inAppBrowser=()=>{const u=navigator.userAgent;return /KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\/|DaumApps|everytimeApp|; wv\)/i.test(u)?(/KAKAOTALK/i.test(u)?'카카오톡':/Instagram/i.test(u)?'인스타그램':/NAVER/i.test(u)?'네이버 앱':'앱 내부'):'';};
async function installApp(){
  if(installEvt&&!inAppBrowser()){installEvt.prompt();try{const c=await installEvt.userChoice;if(c&&c.outcome==='accepted'){installEvt=null;renderMore();return;}}catch(e){}installEvt=null;}
  const ib=inAppBrowser();
  openSheet(`<div class="sheet-h"><h2>홈 화면에 설치</h2><button class="link" onclick="closeSheet()">닫기</button></div>
  ${isStandalone()?'<div class="card muted">이미 앱으로 실행 중입니다.</div>':''}
  ${ib?`<div class="note n-warn" style="margin:0 0 12px"><b>${ib} 브라우저에서는 설치할 수 없습니다</b>오른쪽 위(또는 아래) 메뉴에서 "다른 브라우저로 열기" 또는 "Chrome으로 열기"를 누른 뒤 다시 설치하세요. 아이폰은 사파리로 여세요.<div style="margin-top:8px"><button class="btn sm" onclick="copyLink()">주소 복사</button></div></div>`:''}
  <div class="card"><div class="card-t" style="margin-bottom:6px">안드로이드 (크롬)</div><ol class="cues"><li>오른쪽 위 메뉴(⋮) 누르기</li><li>"앱 설치" 또는 "홈 화면에 추가" 누르기</li><li>"설치"를 고르기. "앱을 설치할 수 없음"이 뜨면 다시 메뉴 › "홈 화면에 추가" › <b>"바로가기 만들기"</b>를 고르세요. 기능은 똑같습니다.</li></ol></div>
  <div class="card"><div class="card-t" style="margin-bottom:6px">삼성 인터넷</div><ol class="cues"><li>아래 메뉴(≡) 누르기</li><li>"현재 페이지 추가" › "홈 화면"</li></ol></div>
  <div class="card"><div class="card-t" style="margin-bottom:6px">아이폰 (사파리)</div><ol class="cues"><li>사파리로 이 페이지 열기</li><li>아래쪽 공유 버튼 누르기</li><li>"홈 화면에 추가" 선택</li></ol></div>
  <div class="card"><div class="row-b" style="margin-bottom:6px"><div class="card-t">설치 진단</div><button class="btn ghost sm" onclick="runInstallCheck()">검사</button></div><div id="instChk" class="tiny">설치가 안 되면 "검사"를 눌러 빠진 파일이 있는지 확인하세요.</div></div>`);
}
function copyLink(){const u=location.href.split('#')[0];(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('주소를 복사했습니다'),()=>toast(u));}
async function runInstallCheck(){
  const out=$('instChk');out.textContent='검사 중...';const rows=[];
  const ok=(t,g,hint)=>rows.push(`<div style="display:flex;gap:8px;padding:3px 0"><b style="color:${g?'var(--good,#1a9b5b)':'var(--bad,#d0443e)'};min-width:34px">${g?'정상':'문제'}</b><span>${t}${!g&&hint?`<br><span class="muted">${hint}</span>`:''}</span></div>`);
  ok('보안 연결(https)',window.isSecureContext,'https:// 주소로 열어야 설치됩니다.');
  ok('일반 브라우저',!inAppBrowser(),'카카오톡·인스타 등 앱 안 브라우저입니다. 크롬이나 사파리로 여세요.');
  let man=null;try{const r=await fetch('manifest.json',{cache:'no-store'});ok('manifest.json',r.ok,'GitHub 저장소 맨 위에 manifest.json을 올리세요.');if(r.ok)man=await r.json();}catch(e){ok('manifest.json',false,'파일을 읽지 못했습니다.');}
  const icons=(man&&man.icons)||[{src:'icons/icon-192.png'},{src:'icons/icon-512.png'}];
  for(const ic of icons){try{const r=await fetch(ic.src,{cache:'no-store'});ok('아이콘 '+ic.src,r.ok&&/image/.test(r.headers.get('content-type')||''),'icons 폴더째로 저장소에 올리세요.');}catch(e){ok('아이콘 '+ic.src,false,'icons 폴더째로 저장소에 올리세요.');}}
  try{const r=await fetch('anim.pack',{method:'HEAD',cache:'no-store'});ok('운동 애니메이션(anim.pack)',r.ok,'anim.pack 파일을 저장소 맨 위에 올리세요.');}catch(e){ok('anim.pack',false);}
  try{const r=await fetch('sw.js',{cache:'no-store'});ok('sw.js',r.ok,'sw.js를 저장소 맨 위에 올리세요.');}catch(e){ok('sw.js',false);}
  try{const reg=await navigator.serviceWorker?.getRegistration();ok('오프라인 작동(서비스 워커)',!!(reg&&reg.active),'새로고침 후 다시 검사하세요.');}catch(e){ok('서비스 워커',false);}
  if(!isIOS())ok('크롬 설치 준비',!!installEvt||isStandalone(),'위 항목이 모두 정상인데 여기만 문제면 메뉴 › "홈 화면에 추가"로 설치하세요. 이미 설치되어 있어도 이렇게 표시됩니다.');
  out.innerHTML=rows.join('');
}
const APP_VER='5.4';
async function checkUpdate(){toast('최신 버전 확인 중...');try{const r=await navigator.serviceWorker?.getRegistration();if(r)await r.update();}catch(e){}setTimeout(()=>location.reload(),600);}
async function initPWA(){
  if('serviceWorker' in navigator){let reloaded=false;const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded&&navigator.serviceWorker.controller){reloaded=true;toast('새 버전이 적용되었습니다');}});}
  if(location.protocol.startsWith('http')&&'serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');}catch(e){}}
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist();}catch(e){}
}
