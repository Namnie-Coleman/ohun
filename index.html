<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오운!">
<meta name="theme-color" id="metaTheme" content="#f4f5f7">
<link rel="manifest" href="manifest.json">
<script src="firebase-config.js"></script>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="OH_UN! 오운! · 오늘 운동 완료. 운동 기록, 러닝 분석, 인바디, 식단을 한 곳에서.">
<title>OH_UN! 오운!</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--card2:#f0f1f4;--line:#e4e6ea;
  --text:#1b1d21;--text2:#5d626b;--text3:#9399a3;
  --pri:#2a78d6;--pri-soft:#e8f1fc;--pri-ink:#ffffff;
  --good:#1f9d63;--good-soft:#e5f5ec;
  --warn:#c77700;--warn-soft:#fdf2e0;
  --bad:#d64545;--bad-soft:#fbeaea;
  --s1:#2a78d6;--s2:#eb6834;
  --pri-mid:#9cc3ee;--mus:#d9dce2;--mus-base:#eef0f3;
  --r:16px;--r-sm:11px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#16171a;--card:#212327;--card2:#2a2d32;--line:#33363c;
  --text:#eef0f3;--text2:#a9aeb7;--text3:#727883;
  --pri:#3987e5;--pri-soft:#1f2f45;--pri-ink:#ffffff;
  --good:#3cb77c;--good-soft:#1c3328;
  --warn:#e09a2c;--warn-soft:#3a2f1c;
  --bad:#e66767;--bad-soft:#3d2224;
  --s1:#3987e5;--s2:#d95926;
  --pri-mid:#3f6ea6;--mus:#454a52;--mus-base:#30333a;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);}
body{color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;}
input,textarea,select{-webkit-user-select:text;user-select:text;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}

/* ── 상단 헤더 ── */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--safe-t) + 10px) 18px 8px;}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.5px;}
.top .sub{font-size:13px;color:var(--text2);margin-top:1px;}
.top-btn{font-size:14px;font-weight:600;color:var(--pri);padding:6px 4px;}

/* ── 본문 ── */
.view{display:none;padding:4px 16px calc(96px + var(--safe-b));max-width:560px;margin:0 auto;}
.view.on{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.card-t{font-size:16px;font-weight:700;}
.card-s{font-size:12px;color:var(--text3);}
.muted{color:var(--text2);font-size:13px;}
.tiny{font-size:11px;color:var(--text3);}
.sec{font-size:13px;font-weight:700;color:var(--text2);margin:18px 4px 8px;}

/* ── 세그먼트 ── */
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text2);}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
:root[data-theme="dark"] .seg button.on{background:#3a3e45;}

/* ── 칩 ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:7px 13px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;color:var(--text2);}
.chip.on{background:var(--pri);color:var(--pri-ink);}

/* ── 폼 ── */
.field{margin-bottom:12px;}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.inp,select.inp,textarea.inp{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1.5px solid transparent;border-radius:var(--r-sm);padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none;}
.inp:focus{border-color:var(--pri);background:var(--card);}
textarea.inp{resize:none;min-height:70px;}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.unit-wrap{position:relative;}
.unit-wrap .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text3);pointer-events:none;}
.unit-wrap .inp{padding-right:38px;}
input[type=range]{width:100%;accent-color:var(--pri);height:28px;}

/* ── 버튼 ── */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border-radius:13px;font-size:16px;font-weight:700;background:var(--pri);color:var(--pri-ink);}
.btn:active{opacity:.85;transform:scale(.99);}
.btn.sub{background:var(--pri-soft);color:var(--pri);}
.btn.ghost{background:var(--card2);color:var(--text);}
.btn.danger{background:var(--bad-soft);color:var(--bad);}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px;width:auto;}
.link{color:var(--pri);font-size:14px;font-weight:600;}
.row-btns{display:flex;gap:8px;}
.row-btns .btn{flex:1;}

/* ── 리스트 ── */
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;}
.li:last-child{border-bottom:none;}
.li-main{flex:1;min-width:0;}
.li-t{font-size:15px;font-weight:600;}
.li-s{font-size:12px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
.chev{color:var(--text3);font-size:18px;}
.ic{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ic svg{width:18px;height:18px;}

/* ── 스탯 ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat{background:var(--card2);border-radius:12px;padding:11px 8px;text-align:center;}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.stat span{font-size:11px;color:var(--text3);}

/* ── 배지 ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;}
.b-pri{background:var(--pri-soft);color:var(--pri);}
.b-good{background:var(--good-soft);color:var(--good);}
.b-warn{background:var(--warn-soft);color:var(--warn);}
.b-bad{background:var(--bad-soft);color:var(--bad);}
.b-pri{background:var(--pri-soft);color:var(--pri);}
.note{border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.55;margin-top:8px;}
.note b{display:block;font-size:13px;margin-bottom:2px;}
.n-good{background:var(--good-soft);} .n-good b{color:var(--good);}
.n-warn{background:var(--warn-soft);} .n-warn b{color:var(--warn);}
.n-bad{background:var(--bad-soft);} .n-bad b{color:var(--bad);}
.n-pri{background:var(--pri-soft);} .n-pri b{color:var(--pri);}

/* ── 진행바 ── */
.pb{margin-bottom:12px;}
.pb-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.pb-l span:last-child{color:var(--text2);font-variant-numeric:tabular-nums;}
.pb-bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;}
.pb-fill{height:100%;border-radius:99px;background:var(--pri);transition:width .5s ease;}

/* ── 회복 링 ── */
.ring-wrap{display:flex;align-items:center;gap:16px;}
.ring{position:relative;width:92px;height:92px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-v b{font-size:26px;font-weight:800;line-height:1;}
.ring-v span{font-size:10px;color:var(--text3);margin-top:2px;}

/* ── 운동 블록 ── */
.ex{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.ex-h{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.ex-h .inp{font-weight:700;}
.ex-tag{font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--card2);color:var(--text2);white-space:nowrap;}
.ex-tag.aux{background:var(--warn-soft);color:var(--warn);}
.set-head,.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;}
.set-head{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:4px;text-align:center;}
.set{margin-bottom:6px;}
.set-n{font-size:13px;font-weight:700;color:var(--text3);text-align:center;}
.set .inp{text-align:center;padding:9px 6px;font-weight:600;}
.x{width:34px;height:34px;border-radius:10px;color:var(--text3);font-size:18px;display:flex;align-items:center;justify-content:center;}
.x:active{background:var(--card2);}
.ex-f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.prev{font-size:12px;color:var(--text3);margin:-4px 0 8px;}

.ex-name{font-size:16px;font-weight:700;}
.chk{width:44px;height:40px;border-radius:10px;background:var(--card2);color:var(--text3);display:flex;align-items:center;justify-content:center;}
.chk svg{width:20px;height:20px;}
.set.done .chk{background:var(--good);color:#fff;}
.set.done .inp{background:var(--good-soft);color:var(--good);}
.set.done .set-n{color:var(--good);}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px;}
.chips.scroll::-webkit-scrollbar{display:none;}
.chips.scroll .chip{flex-shrink:0;}
.pk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.pk.on{background:var(--pri);border-color:var(--pri);}
.sheet-foot{position:sticky;bottom:calc(-20px - var(--safe-b));background:var(--bg);padding:10px 0 calc(10px + var(--safe-b));margin-bottom:calc(-20px - var(--safe-b));}
.step{display:flex;align-items:center;background:var(--card2);border-radius:11px;height:42px;}
.step button{width:36px;height:42px;font-size:20px;color:var(--pri);font-weight:600;}
.step b{flex:1;text-align:center;font-size:16px;font-variant-numeric:tabular-nums;}
.rest{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--safe-b));z-index:40;max-width:536px;margin:0 auto;display:none;align-items:center;gap:6px;background:var(--text);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 6px 20px rgba(0,0,0,.18);}
.rest.on{display:flex;}
body.resting .toast{bottom:calc(140px + var(--safe-b));}
body.resting .view{padding-bottom:calc(160px + var(--safe-b));}
.rest .rest-l{font-size:13px;opacity:.7;}
.rest b{flex:1;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
.rest button{font-size:13px;font-weight:700;padding:8px 9px;border-radius:10px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);}

/* ── 가이드 / 운동 모드 ── */
.gbox{background:var(--card);border-radius:var(--r);padding:10px;margin-bottom:12px;min-height:236px;}
.gbox svg{display:block;width:100%;max-height:220px;}
.cues{padding:6px 6px 6px 26px;font-size:14px;line-height:1.6;}
.cues li{margin-bottom:8px;}
.ph{width:100%;max-width:260px;aspect-ratio:1/1;margin:0 auto;}
.ph img{width:100%;height:100%;object-fit:contain;display:block;}
.ph.ek{position:relative;background:#fff;border-radius:14px;}
.ph.ek img{position:absolute;inset:6%;width:88%;height:88%;}
.ph.ek img.t{animation:ekSwap 2.6s ease-in-out infinite;}
@keyframes ekSwap{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
.ph.ek img.r{animation:ekSwapR 2.6s ease-in-out infinite;}
@keyframes ekSwapR{0%,35%{opacity:1}50%,85%{opacity:0}100%{opacity:1}}
:root[data-theme="dark"] .ph.ek{background:transparent;}
:root[data-theme="dark"] .ph.ek img{filter:invert(1);mix-blend-mode:screen;opacity:.92;}
.bm-wrap{display:flex;justify-content:center;gap:4px;}
.bm{flex:1;max-width:170px;text-align:center;}
.bm svg{display:block;width:100%;max-height:300px;}
.bm span{font-size:11px;color:var(--text3);}
.mus-leg{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2);margin-top:6px;padding:0 6px;}
.mus-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.wm{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--safe-t) + 8px) 16px calc(18px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;}
.wm.on{display:block;}
.wm-top{display:flex;align-items:center;justify-content:space-between;}
.wm-top b{font-size:20px;font-variant-numeric:tabular-nums;}
.wm-name{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.wm-name .x{font-size:28px;width:40px;height:40px;}
.dots{display:flex;gap:5px;}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--card2);}
.dots i.on{background:var(--good);}
.step .inp{flex:1;min-width:0;text-align:center;background:transparent;padding:8px 2px;font-weight:700;border:none;}
.rest-ring{position:relative;width:210px;height:210px;margin:10px auto 16px;}
.rest-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rest-v span{font-size:13px;color:var(--text3);}
.rest-v b{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;}
body.wmode .rest,body.wmode .tabbar{display:none!important;}
.ex-name.tap{cursor:pointer;}

.ib-row{display:grid;grid-template-columns:58px 1fr 92px;gap:8px;align-items:center;margin-bottom:9px;}
.ib-l{font-size:13px;font-weight:600;}
.ib-bar{position:relative;height:14px;background:var(--card2);border-radius:4px;overflow:hidden;}
.ib-z{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 18%,transparent);}
.ib-f{position:absolute;left:0;top:4px;bottom:4px;border-radius:0 3px 3px 0;}
.ib-v{font-size:12px;color:var(--text2);text-align:right;line-height:1.25;font-variant-numeric:tabular-nums;}
.ib-v b{font-size:15px;color:var(--text);margin-right:1px;}
.ib-v span{display:block;font-size:10.5px;font-weight:700;}

.splash{position:fixed;inset:0;z-index:100;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .4s;}
.splash b{display:block;font-size:44px;font-weight:900;letter-spacing:-1px;}
.splash-logo{width:96px;height:96px;display:block;margin:0 auto 14px;}
.brand{display:inline-flex;align-items:center;gap:9px;}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b8cec,#1d5fc0);display:inline-flex;flex:none;}
.brand i svg{width:100%;height:100%;}
.splash span{font-size:15px;opacity:.85;}
.splash.off{opacity:0;pointer-events:none;}
.top h1#title{letter-spacing:-.5px;}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal i{font-style:normal;font-size:12px;line-height:30px;border-radius:9px;color:var(--text3);font-variant-numeric:tabular-nums;}
.cal i.cal-h{line-height:18px;font-size:11px;font-weight:700;}
.cal i.on{background:var(--pri);color:#fff;font-weight:700;}
.cal i.td{box-shadow:inset 0 0 0 2px var(--pri);color:var(--text);}
.cal i.on.td{color:#fff;}

/* ── 탭바 ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--text3);font-size:10.5px;font-weight:600;}
.tab svg{width:24px;height:24px;}
.tab.on{color:var(--pri);}

/* ── 시트 ── */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
.dim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.8,.3,1);padding:8px 16px calc(20px + var(--safe-b));max-width:560px;margin:0 auto;}
.sheet.on{transform:none;}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px;}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sheet-h h2{font-size:19px;font-weight:800;}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);background:#2b2e33;color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ── 차트 ── */
.chart{position:relative;width:100%;}
.chart svg{display:block;width:100%;overflow:visible;}
.chart .grid{stroke:var(--line);stroke-width:1;}
.chart .axis{fill:var(--text3);font-size:10px;font-family:var(--font);}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:2;}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:6px;}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:22px 8px;}
table.t{width:100%;border-collapse:collapse;font-size:13px;}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
table.t tr:last-child td{border-bottom:none;}
.fold{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.fold>summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:4px 0}.fold>summary::-webkit-details-marker{display:none}.fold>summary::after{content:'▾';color:var(--text3);font-size:12px;margin-left:6px}.fold[open]>summary::after{content:'▴'}.fold>summary .tiny{margin-left:auto}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.hm-h{text-align:center;font-size:11px;color:var(--text3);padding-bottom:2px}
.hm-c{aspect-ratio:1;border:0;border-radius:8px;background:var(--card2);color:var(--text);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;cursor:pointer}
.hm-c.td{box-shadow:inset 0 0 0 2px var(--pri)}.hm-c.sel{outline:2px solid var(--text);outline-offset:1px}.hm-c i{display:flex;gap:2px;height:5px}
.hm-c b,.hm-lg b{width:5px;height:5px;border-radius:50%;display:inline-block}.d-f{background:var(--good)}.d-r{background:var(--warn)}.d-w{background:var(--text3)}
.hm-lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-top:10px}.hm-lg span{display:flex;align-items:center;gap:4px}.hm-sw{width:10px!important;height:10px!important;border-radius:3px!important;background:var(--pri)}
.row-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;border:0;cursor:pointer}
.wk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 12px}.wk-d{display:flex;flex-direction:column;align-items:center;gap:3px}.wk-d i{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700;color:var(--text3)}.wk-d span{font-size:11px;color:var(--text3)}.wk-d.on i{background:var(--pri);color:#fff}.wk-d.td i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--pri)}
.credit{display:block;text-align:center;margin:14px auto 4px;font-size:12px;color:var(--text3);text-decoration:none;padding:8px}.credit b{color:var(--pri);font-weight:700}
.wcups{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.wcups i{width:16px;height:22px;border-radius:3px 3px 6px 6px;border:2px solid var(--pri);opacity:.35}.wcups i.on{background:var(--pri);opacity:1}
.ocr-bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:10px}.ocr-bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}.ocr-m{font-weight:700}
.inp.ocr-fill{background:color-mix(in srgb,#ffd34d 30%,var(--card2))!important;box-shadow:inset 0 0 0 1.5px #e0b400}
.tg{flex:none;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s;padding:0}.tg::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}.tg.on{background:var(--pri)}.tg.on::after{left:21px}
.medb{border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:13px;line-height:1.5}.medb>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}.medb>summary::-webkit-details-marker{display:none}.medb>summary::after{content:'▾';margin-left:auto;opacity:.6}.medb[open]>summary::after{content:'▴'}.medb-i{margin-top:8px}.medb-i b{margin-right:4px}
.medb.n-bad{background:var(--bad-soft,rgba(220,60,60,.1));color:var(--text)}.medb.n-warn{background:var(--warn-soft);color:var(--text)}.medb.n-pri{background:var(--pri-soft,rgba(42,120,214,.1));color:var(--text)}

<body>

<header class="top">
  <div class="top-row">
    <div><h1 id="title">오늘</h1><div class="sub" id="subtitle"></div></div>
    <button class="top-btn" id="topAction"></button>
  </div>
</header>

<!-- ═════════ 홈 ═════════ -->
<main class="view on" id="v-home"></main>

<!-- ═════════ 운동 ═════════ -->
<main class="view" id="v-log">
  <div class="seg" id="logSeg">
    <button class="on" data-k="weight">웨이트</button>
    <button data-k="run">러닝</button>
    <button data-k="wod">WOD</button>
  </div>
  <div id="logWod" style="display:none"></div>
  <div id="logWeight">
    <div class="card" style="padding:12px 14px">
      <div style="display:flex;gap:8px;align-items:center">
        <input class="inp" type="date" id="logDate" style="flex:1" onchange="draft.date=this.value;saveDraft()">
        <button class="btn sub sm" style="padding:11px 16px" onclick="openRoutineSheet()">루틴</button>
      </div>
      <div id="sessInfo" class="tiny" style="margin-top:8px"></div><div id="modeBtn"></div>
    </div>
    <div id="exList"></div>
    <button class="btn ghost" style="margin-bottom:12px" onclick="openPicker('log')">+ 종목 추가</button>
    <div class="card"><label class="lbl">메모</label><textarea class="inp" id="logMemo" placeholder="오늘 느낌, 특이사항" oninput="draft.memo=this.value;saveDraft()"></textarea></div>
    <button class="btn" onclick="saveWorkout()">운동 완료</button>
  </div>
  <div id="logRun" style="display:none">
    <div class="card">
      <div class="field"><label class="lbl">날짜</label><input class="inp" type="date" id="runDate"></div>
      <div class="g2">
        <div class="field"><label class="lbl">거리</label><div class="unit-wrap"><input class="inp" id="runKm" inputmode="decimal" placeholder="5.0" oninput="runPaceLive()"><span class="u">km</span></div></div>
        <div class="field"><label class="lbl">시간</label><div class="unit-wrap"><input class="inp" id="runMin" inputmode="decimal" placeholder="30" oninput="runPaceLive()"><span class="u">분</span></div></div>
        <div class="field"><label class="lbl">평균 페이스</label><input class="inp" id="runPace" readonly placeholder="자동" style="color:var(--pri);font-weight:700"></div>
        <div class="field"><label class="lbl">평균 심박</label><div class="unit-wrap"><input class="inp" id="runHr" inputmode="numeric" placeholder="선택"><span class="u">bpm</span></div></div>
      </div>
      <div class="lbl">종류</div><div class="chips" id="runType" style="margin-bottom:12px"></div>
      <div class="field"><label class="lbl">가민 활동 링크 (선택)</label><input class="inp" id="runLink" placeholder="https://connect.garmin.com/..." autocomplete="off"></div>
      <div class="field" style="margin:0"><label class="lbl">메모</label><input class="inp" id="runMemo" placeholder="코스, 날씨 등"></div>
    </div>
    <button class="btn" onclick="saveRun()">러닝 저장</button>
    <div class="card" style="margin-top:12px"><div class="card-t" style="margin-bottom:4px">워치 기록 가져오기</div>
      <div class="muted" style="margin-bottom:10px">가민·애플워치·순토·코로스 등에서 내보낸 TCX 또는 GPX 파일을 고르면 거리·시간·심박·케이던스·고도·구간 페이스가 자동으로 들어갑니다. 여러 개를 한 번에 골라도 됩니다.</div>
      <button class="btn sub" onclick="$('runFile').click()">TCX / GPX 파일 선택</button>
      <input type="file" id="runFile" accept=".tcx,.gpx,application/gpx+xml,application/vnd.garmin.tcx+xml,application/xml,text/xml" multiple style="display:none" onchange="importRunFiles(event)">
      <button class="link" style="margin-top:10px;font-size:13px" onclick="garminHelp()">가민 커넥트에서 파일 받는 법</button></div>
  </div>
</main>

<div class="splash" id="splash"><div><svg class="splash-logo" viewBox="88 88 336 336" aria-hidden="true"><path d="M344.9,181.4 A116,116 0 1 1 260.0,140.1" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round"/><circle cx="310.5" cy="153.6" r="19" fill="#ffd34d"/><path d="M200,260 L242,300 L318,216" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/></svg><b>OH_UN!</b><span>오늘 운동, 완료!</span></div></div>
<div class="toast" id="toast"></div>
<div class="rest" id="rest"></div>
<div class="wm" id="wm"></div>

<script>
/* OH_UN! 코드 목차 (구역 머리글 '═══'로 검색)
   01. 데이터
   02. 유틸
   03. 과학 로직
   04. 아이콘
   05. 탭 / 내비
   06. 시트
   07. 차트 (SVG)
   08. 홈
   09. 종목 라이브러리
   10. 동작 애니메이션 (2D 운동학)
   11. 근육 지도
   12. 종목 가이드 (동작 · 근육 · 내 기록)
   13. 운동 모드
   14. 주간 부위별 볼륨
   15. 운동 기록 (진행 중 세션)
   16. 종목 선택 시트
   17. 루틴
   18. 기록
   19. 식단
   20. 첫 설정 · 맞춤 제언
   21. 더보기
   22. 프로그램 (요일·주차 플랜)
   23. v6: 자동 조정 · RIR · 공유 카드 · 주간 리포트 · 슈퍼세트 · 바코드 · 휴식 알림
   24. 식약처 식품영양성분 DB (공공데이터포털 · 정적 파일)
   25. v6.3: 초성·영어 검색 · 빠른 음식 · 끼니 템플릿 · CSV · 공개판 안내 · 카메라 공유 카드
   26. 식단 v2: 끼니별 (아침·점심·저녁·간식)
   27. 오운완 공유 카드 v2: 크기 선택 · 간결한 좌하단 텍스트 · 필터 · 사진 편집
   28. WOD (크로스핏) · 단독 도구 (타이머 · 스톱워치 · 인터벌 · 페이스)
   29. 설치 · 오프라인
   30. 시작
   규칙: 함수·상수 이름 중복 금지(테스트 t_dup 검사) · 날짜는 today()/daysAgo()/ymdL()만 사용(toISOString 날짜 변환 금지) */
/* ══════════════════════ 데이터 ══════════════════════ */
const KEY='rts_app_v4';
const DEF={prog:null,profile:{name:'',height:0,weight:0,age:0,gender:'male',goal:'hypertrophy',exp:'intermediate',freq:4,rm:{squat:0,dead:0,bench:0,ohp:0,row:0}},
  logs:[],runs:[],bw:[],food:[],routines:[],customEx:[],rest:90,check:null,dietMode:'maintain',theme:'auto'};
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
  if(!S){S=structuredClone(DEF);saveLocal();}
  S={...structuredClone(DEF),...S};S.routines=S.routines.map(normRoutine);S.profile={...DEF.profile,...S.profile,rm:{...DEF.profile.rm,...(S.profile?.rm||{})}};
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('저장 공간 오류');}}
function save(){S.updatedAt=Date.now();S.dirty=1;saveLocal();if(typeof cloudQueue==='function')cloudQueue();}

/* 이전 버전(v3) 데이터 자동 이전 */
const hasOld=()=>{try{return JSON.parse(localStorage.getItem('rts_profiles')||'[]').length>0;}catch(e){return false;}};
function importOldLocal(){confirmSheet('이 기기에 있는 이전 Road to Strongman 기록을 가져올까요? 현재 프로필은 이전 프로필로 바뀝니다.',()=>{migrateOld();S.routines=(S.routines||[]).map(normRoutine);S.onb=1;save();closeSheet();go('home');toast('이전 기록을 가져왔습니다');},'가져오기',false);}
function migrateOld(){
  try{
    const ps=JSON.parse(localStorage.getItem('rts_profiles')||'[]');if(!ps.length)return;
    const uid=localStorage.getItem('rts_activeUID')||ps[0].id;
    const fromV3=convertV3({profiles:ps,logs:JSON.parse(localStorage.getItem('rts_logs')||'[]'),runLogs:JSON.parse(localStorage.getItem('rts_runlogs')||'[]'),bwLog:JSON.parse(localStorage.getItem('rts_bwlog')||'[]'),foodLog:JSON.parse(localStorage.getItem('rts_foodlog')||'[]')},uid);
    Object.assign(S,fromV3);
    const cr=JSON.parse(localStorage.getItem('rts_customRoutines')||'[]');
    S.routines=cr.map(r=>({id:r.id,name:r.name,exs:r.exercises||[]}));
  }catch(e){}
}
function convertV3(d,uid){
  const ps=d.profiles||[];const p=ps.find(x=>x.id===uid)||ps[0];if(!p)return{};
  uid=p.id;
  const mapEx=(arr,aux)=>(arr||[]).map(e=>({name:e.name||'',aux,sets:(e.sets||[]).map(s=>({w:+s.weight||0,r:+s.reps||0}))}));
  return{
    profile:{name:p.name||'',height:p.height||0,weight:p.weight||0,age:p.age||0,gender:p.gender||'male',goal:p.goal||'hypertrophy',exp:p.exp||'intermediate',freq:p.freq||4,rm:{...DEF.profile.rm,...(p.rm||{})}},
    logs:(d.logs||[]).filter(l=>l.uid===uid).map(l=>finalizeLog({id:'l'+(l.ts||Date.now())+Math.random().toString(36).slice(2,5),date:l.date,part:l.bodypart||'fullbody',memo:l.memo||'',exs:[...mapEx(l.mainExs,false),...mapEx(l.auxExs,true)],sleep:l.sleep||0,cond:l.cond||0,ts:l.ts||0})),
    runs:(d.runLogs||[]).filter(l=>l.uid===uid).map(l=>({id:'r'+(l.id||Date.now()),date:l.date,km:+l.km||0,min:+l.min||0,hr:+l.hr||0,memo:l.memo||''})),
    bw:(d.bwLog||[]).filter(e=>e.uid===uid).map(e=>({date:e.date,weight:+e.weight||0,muscle:+e.muscle||0,fat:+e.fat||0})),
    food:(d.foodLog||[]).map(f=>({id:'f'+f.id,date:f.date,name:f.name,kcal:+f.kcal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0}))
  };
}

/* ══════════════════════ 유틸 ══════════════════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymdL=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymdL(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymdL(d);};
const md=s=>{const [,m,d]=s.split('-');return (+m)+'/'+(+d);};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0;};
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const r1=n=>Math.round(n*10)/10;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

/* ══════════════════════ 과학 로직 ══════════════════════ */
const BIG5=[['squat','스쿼트'],['dead','데드리프트'],['bench','벤치프레스'],['ohp','오버헤드프레스'],['row','바벨로우']];
const PART_L={chest:'가슴',back:'등',legs:'하체',shoulders:'어깨',arms:'팔',core:'코어',push:'푸시',pull:'풀',fullbody:'전신',chest_tri:'가슴+삼두',chest_shoulder:'가슴+어깨',back_bi:'등+이두',legs_core:'하체+코어',rest:'휴식',cond:'컨디셔닝'};
const BPMAP={chest:'chest',chest_tri:'chest',chest_shoulder:'chest',back:'back',back_bi:'back',legs:'legs',legs_core:'legs',shoulders:'shoulders',arms:'arms',core:'core'};
const GOAL_L={hypertrophy:'근비대',strength:'근력',fat_loss:'체지방 감소',hybrid:'하이브리드(러닝 병행)',endurance:'근지구력',maintenance:'유지'};
const EXP_L={beginner:'초보 (0~1년)',intermediate:'중급 (1~3년)',advanced:'고급 (3년+)'};
const INT={hybrid:{pct:.75,rx:'5-8회 × 3-4세트'},strength:{pct:.87,rx:'3-5회 × 3-5세트'},hypertrophy:{pct:.70,rx:'8-12회 × 3-4세트'},endurance:{pct:.55,rx:'15-20회 × 2-3세트'},fat_loss:{pct:.65,rx:'12-15회 × 3-4세트'},maintenance:{pct:.70,rx:'8-12회 × 2-3세트'}};
const VOL={beginner:{chest:[6,10,14],back:[8,12,18],legs:[8,14,20],shoulders:[6,10,14],arms:[6,10,14],fullbody:[16,24,34],push:[8,12,18],pull:[8,12,18],core:[4,8,12]},
  intermediate:{chest:[8,14,20],back:[10,16,22],legs:[10,16,22],shoulders:[8,14,20],arms:[8,14,18],fullbody:[20,30,44],push:[10,14,22],pull:[10,14,22],core:[6,10,16]},
  advanced:{chest:[10,18,24],back:[12,20,26],legs:[12,18,24],shoulders:[10,16,22],arms:[10,16,22],fullbody:[24,36,54],push:[12,18,26],pull:[12,18,26],core:[8,12,18]}};

const epley=(w,r)=>r<=1?w:w*(1+r/30);
const brzycki=(w,r)=>r<=1?w:w/(1.0278-0.0278*r);
const est1RM=(w,r)=>r>12?epley(w,r):(epley(w,r)+brzycki(w,r))/2;
const round25=x=>Math.round(x/2.5)*2.5;
const bmr=p=>p.weight&&p.height&&p.age?Math.round(10*p.weight+6.25*p.height-5*p.age+(p.gender==='male'?5:-161)):0;

function recovery(c){
  let s=55;const sl=c.sleep;
  if(sl>=8.5)s+=22;else if(sl>=7)s+=14;else if(sl>=6)s+=2;else if(sl>=5)s-=14;else if(sl>0)s-=28;
  s+=(c.cond-5)*4;
  if(c.yday==='heavy')s-=12;else if(c.yday==='moderate')s-=4;else s+=5;
  return Math.max(10,Math.min(100,Math.round(s)));
}
function intensityOf(score){
  if(score>=85)return{l:'최상',d:'고중량 도전이나 최고 볼륨 세션에 좋은 날입니다.',adj:1,cls:'good'};
  if(score>=70)return{l:'좋음',d:'계획한 중량으로 정상 훈련하세요.',adj:.97,cls:'good'};
  if(score>=55)return{l:'보통',d:'권장 중량에서 5~10% 낮춰 진행하세요.',adj:.93,cls:'warn'};
  if(score>=40)return{l:'가볍게',d:'볼륨을 20%가량 줄이는 것을 권장합니다.',adj:.88,cls:'warn'};
  return{l:'회복 권장',d:'가벼운 활동이나 휴식이 더 효과적입니다.',adj:.85,cls:'bad'};
}
function volStatus(sets,part){
  const p=S.profile,t=(VOL[p.exp]||VOL.intermediate)[part]||[10,16,22],f=p.freq||4;
  const mev=Math.max(1,Math.round(t[0]/f*1.2)),mav=Math.max(2,Math.round(t[1]/f*1.2)),mrv=Math.max(3,Math.round(t[2]/f*1.2));
  if(!sets)return{cls:'pri',l:'기록 없음',d:'',mev,mav,mrv};
  if(sets<mev)return{cls:'pri',l:'볼륨 부족',d:`최소 유효 볼륨 ${mev}세트 미만입니다. 다음엔 1세트 추가하거나 중량을 2.5~5% 올려보세요.`,mev,mav,mrv};
  if(sets<=mav)return{cls:'good',l:'적정 볼륨',d:`최적 구간(${mev}~${mav}세트)입니다. 2~3주 유지 후 중량을 2.5kg 올리세요.`,mev,mav,mrv};
  if(sets<=mrv)return{cls:'warn',l:'고볼륨',d:`회복 한계(${mrv}세트)에 가깝습니다. 48~72시간 회복, 수면과 단백질을 챙기세요.`,mev,mav,mrv};
  return{cls:'bad',l:'과다 볼륨',d:`회복 한계(${mrv}세트)를 넘었습니다. 다음 세션은 20~30% 줄이세요.`,mev,mav,mrv};
}
function finalizeLog(l){
  let vol=0,sets=0;
  l.exs=l.exs.filter(e=>e.name||e.sets.length);
  l.exs.forEach(e=>{e.sets=e.sets.filter(s=>s.r>0);const tm=isTimed(e.name);e.sets.forEach(s=>{if(!tm)vol+=s.w*s.r;sets++;});});
  l.vol=Math.round(vol);l.sets=sets;return l;
}

/* ══════════════════════ 차트 (SVG) ══════════════════════ */
function chart(el,labels,series,opt={}){
  const W=340,H=opt.h||170,pl=34,pr=8,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  const all=series.flatMap(s=>s.data.filter(v=>v!=null));if(!all.length){el.innerHTML='<div class="empty">데이터 없음</div>';return;}
  let mn=opt.bar?0:Math.min(...all),mx=Math.max(...all);
  if(!opt.bar){const pad=(mx-mn)*.15||1;mn=Math.max(0,mn-pad);mx=mx+pad;}else mx=mx*1.1||1;
  const n=labels.length,x=i=>pl+(opt.bar?(i+.5)*iw/n:(n===1?iw/2:i*iw/(n-1))),y=v=>pt+ih-(v-mn)/(mx-mn)*ih;
  let g='';
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,yy=y(v);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="axis" x="${pl-5}" y="${yy+3}" text-anchor="end">${opt.yfmt?opt.yfmt(v):v>=1000?r1(v/1000)+'k':(mx-mn)<10?r1(v):Math.round(v)}</text>`;}
  const step=Math.max(1,Math.ceil(n/6));
  labels.forEach((l,i)=>{if((i%step===0&&(i===n-1||n-1-i>=step*.6))||i===n-1)g+=`<text class="axis" x="${x(i)}" y="${H-5}" text-anchor="middle">${l}</text>`;});
  series.forEach(s=>{
    if(opt.bar){const bw=Math.max(4,Math.min(22,iw/n-4));s.data.forEach((v,i)=>{if(!v)return;const yy=y(v),h=pt+ih-yy;g+=`<path d="M${x(i)-bw/2},${pt+ih}V${yy+Math.min(4,h)}q0,-4 4,-4h${bw-8}q4,0 4,4V${pt+ih}z" fill="${s.color}"/>`;});}
    else{let d='';s.data.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+x(i)+','+y(v);});g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      s.data.forEach((v,i)=>{if(v!=null&&n<=31)g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;});}
  });
  g+=`<line id="xh" class="grid" y1="${pt}" y2="${pt+ih}" style="display:none;stroke:var(--text3)"/>`;
  const leg=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`:'';
  el.innerHTML=`${leg}<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}<rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('#xh');
  const show=ev=>{const r=svg.getBoundingClientRect(),px=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left,vx=px/r.width*W;
    let i=opt.bar?Math.floor((vx-pl)/iw*n):Math.round((vx-pl)/iw*(n-1));i=Math.max(0,Math.min(n-1,i));
    const lines=series.map(s=>s.data[i]!=null?`${series.length>1?s.name+' ':''}${opt.fmt?opt.fmt(s.data[i]):s.data[i]}`:null).filter(Boolean);if(!lines.length)return;
    tip.innerHTML=`${labels[i]}<br>${lines.join('<br>')}`;tip.style.display='block';tip.style.left=(x(i)/W*r.width)+'px';
    const top=Math.min(...series.map(s=>s.data[i]!=null?y(s.data[i]):H));tip.style.top=(top/H*r.height)+'px';
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.display='';};
  const hide=()=>{tip.style.display='none';xh.style.display='none';};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide);svg.addEventListener('touchend',()=>setTimeout(hide,1500));
}

function muscleSVG(name){

    for(const[slug,p]of Object.entries(BODY[k])){const m=BODY_MAP[k][slug];let c='var(--mus-base)';
      if(m){c=m.some(x=>i.prim.includes(x))?'var(--pri)':m.some(x=>i.sec.includes(x))?'var(--pri-mid)':'var(--mus)';}
      g+=`<path d="${p}" fill="${c}"/>`;}
    return`<div class="bm"><svg viewBox="${vb}">${g}</svg><span>${k==='front'?'앞':'뒤'}</span></div>`;};
  return`<div class="bm-wrap">${side('front','40 60 644 1340','outF')}${side('back','764 60 644 1340','outB')}</div>`;
}
function musLegend(name){const i=exInfo(name),n=a=>a.map(m=>MUS_L[m]).join(', ');
  return`<div class="mus-leg">${i.prim.length?`<span><i style="background:var(--pri)"></i>주동근 ${n(i.prim)}</span>`:''}${i.sec.length?`<span><i style="background:var(--pri-mid)"></i>보조근 ${n(i.sec)}</span>`:''}</div>`;}

/* ══════════════════════ 종목 가이드 (동작 · 근육 · 내 기록) ══════════════════════ */
function exHistory(name){
  const out=[];S.logs.forEach(l=>{const e=l.exs.find(x=>x.name===name);if(!e||!e.sets.length)return;
    const top=e.sets.reduce((a,s)=>(s.w*100+s.r>a.w*100+a.r?s:a),e.sets[0]);
    const est=Math.max(0,...e.sets.filter(s=>s.w&&s.r&&s.r<=12).map(s=>est1RM(s.w,s.r)));
    out.push({date:l.date,top,est:r1(est),sets:e.sets.length,vol:e.sets.reduce((a,s)=>a+s.w*s.r,0)});});
  return out;
}
function exHistHTML(name){
  const H=exHistory(name),t=isTimed(name);
  if(!H.length)return'<div class="empty">아직 이 종목 기록이 없어요</div>';
  const best=t?Math.max(...H.map(h=>h.top.r)):Math.max(...H.map(h=>h.est));
  return`<div class="stats" style="margin-bottom:10px"><div class="stat"><b>${H.length}</b><span>세션</span></div><div class="stat"><b>${best||'-'}</b><span>${t?'최고 초':'추정 1RM'}</span></div><div class="stat"><b>${t?H.at(-1).top.r:H.at(-1).top.w}</b><span>최근 ${t?'초':'kg'}</span></div></div>
  ${H.length>1?`<div id="ehChart"></div>`:''}
  <table class="t" style="margin-top:6px">${[...H].reverse().slice(0,6).map(h=>`<tr><td style="color:var(--text3)">${md(h.date)}</td><td>${t?h.top.r+'초':h.top.w+'kg × '+h.top.r}</td><td style="text-align:right;color:var(--text2)">${h.sets}세트</td></tr>`).join('')}</table>`;
}
function guideHTML(name,idp){
  const ek=!!EKV[name];
  return`<div class="seg" id="${idp}Seg" style="margin-bottom:10px"><button class="${ek?'on':''}" data-k="anim">${ek?'동작':'도식'}</button><button class="${ek?'':'on'}" data-k="mus">근육</button><button data-k="his">내 기록</button></div>
  <div class="gbox"><div id="${idp}Anim" style="${ek?'':'display:none'}"><div class="ph" id="${idp}Ph" style="display:none"></div><svg viewBox="0 0 200 186" id="${idp}Fig"></svg>
  <div style="display:flex;justify-content:space-between;align-items:center;min-height:22px;padding:0 4px"><span class="tiny" id="${idp}FigL"></span>${EKV[name]?`<button class="link" style="font-size:12px" id="${idp}Tg" data-n="${esc(name)}" onclick="S.view=S.view==='svg'?'gif':'svg';save();showAnim('${idp}',this.dataset.n)"></button>`:''}</div></div>
  <div id="${idp}Mus" style="${ek?'display:none':''}">${muscleSVG(name)}${musLegend(name)}${ek?'':'<div class="tiny" style="text-align:center;margin-top:6px">이 종목은 동작 그림이 없어 근육 지도를 먼저 보여 줘요 · 간단한 움직임은 도식 탭</div>'}</div>
  <div id="${idp}His" style="display:none"></div></div>`;

function bindGuide(idp,name){
  bindSeg(idp+'Seg',k=>{$(idp+'Anim').style.display=k==='anim'?'':'none';$(idp+'Mus').style.display=k==='mus'?'':'none';$(idp+'His').style.display=k==='his'?'':'none';
    if(k==='anim')showAnim(idp,name);else cancelAnimationFrame(animRaf);
    if(k==='his'){$(idp+'His').innerHTML=exHistHTML(name);const H=exHistory(name).slice(-20),t=isTimed(name);if($('ehChart'))chart($('ehChart'),H.map(h=>md(h.date)),[{name:t?'초':'추정 1RM',data:H.map(h=>t?h.top.r:h.est||null),color:'var(--s1)'}],{h:140,fmt:v=>v+(t?'초':' kg')});}});
  if(EKV[name])showAnim(idp,name);else cancelAnimationFrame(animRaf);
}
function openGuide(name){
  const i=exInfo(name);

  <div class="tiny" style="margin:-8px 0 10px">${PART_L[i.part]||''} · ${EQ_L[i.eq]||''}${i.t===1?' · 시간형(초)':i.t===2?' · 거리형(m)':''}</div>${guideHTML(name,'gd')}`);

}

function beep(n=2){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*.22;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2);}}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
async function keepAwake(on){try{if(on&&'wakeLock' in navigator){wm.lock=await navigator.wakeLock.request('screen');}else if(!on&&wm.lock){await wm.lock.release();wm.lock=null;}}catch(e){}}

function nextPtr(fromEi){
  const E=draft.exs;for(let k=0;k<E.length;k++){const ei=(fromEi+k)%E.length;const si=E[ei].sets.findIndex(s=>!s.done);if(si>=0)return{ei,si};}return null;
}

  if(!draft.exs.length){toast('먼저 종목이나 루틴을 추가하세요');return;}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}
  if(!draft.startedAt){draft.startedAt=Date.now();saveDraft();}
  const p=nextPtr(0);wm.ei=p?p.ei:0;wm.phase=restEnd>Date.now()?'rest':'set';wm.open=true;
  closeSheet();document.body.classList.add('wmode');$('wm').classList.add('on');keepAwake(true);wmRender();

}
function closeWM(){navPop();wm.open=false;$('wm').classList.remove('on');document.body.classList.remove('wmode');clearInterval(wm.tick);cancelAnimationFrame(animRaf);keepAwake(false);renderExList();if(restEnd>Date.now())startRest((restEnd-Date.now())/1000);}
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function wmTick(){
  if(!wm.open)return;scheduleRestNoti();const el=$('wmClock');if(el)el.textContent=mmss((Date.now()-(draft.startedAt||Date.now()))/1000);
  if(wm.phase==='rest'){const left=(restEnd-Date.now())/1000;if(left<=0){wm.phase='set';beep(3);wmRender();return;}
    if(!$('wmRestT'))return;$('wmRestT').textContent=mmss(left);const tot=wm.restTot||S.rest||90,c=2*Math.PI*88;$('wmRing').setAttribute('stroke-dashoffset',c*(1-left/tot));}
  if(wm.phase==='work'){const left=(wm.workEnd-Date.now())/1000;if(left<=0){beep(3);wm.phase='set';wmComplete();return;}if($('wmWorkT'))$('wmWorkT').textContent=mmss(left);}
}

function wmAdj(k,d){const si=curSet();if(si<0)return;const s=draft.exs[wm.ei].sets[si];s[k]=Math.max(0,r1(num(s[k])+d));propagate(wm.ei,si,k,s[k]);saveDraft();const _i=$(k==='w'?'wmW':'wmR');if(_i)_i.value=s[k];if(k==='w'&&$('wmPl'))$('wmPl').textContent=plates(s[k]);}
function wmStartWork(){const si=curSet(),s=draft.exs[wm.ei].sets[si];if(!num(s.r))s.r=30;wm.workEnd=Date.now()+num(s.r)*1000;wm.phase='work';beep(1);wmRender();}
function wmComplete(){
  const e=draft.exs[wm.ei],si=curSet();if(si<0)return;const s=e.sets[si];
  const w=$('wmW'),r=$('wmR');if(w)s.w=w.value;if(r)s.r=r.value;
  if(!num(s.r)){toast(isTimed(e.name)?'시간을 입력하세요':'횟수를 입력하세요');return;}
  s.done=true;const nx=e.sets[si+1];if(nx&&!nx.done&&!num(nx.w)&&num(s.w))nx.w=s.w;saveDraft();
  wm.last={ei:wm.ei,si};
  if(ssAdvance()){beep(1);wmRender();return;}
  const np=nextPtr(wm.ei);
  if(!np){wm.phase='set';beep(2);wmRender();return;}
  if(wm.ssRest)wm.ssRest=false;else wm.ei=np.ei;
  if(S.rest){wm.restTot=S.rest;restEnd=Date.now()+S.rest*1000;wm.phase='rest';}else wm.phase='set';
  wmRender();
}

/* ══════════════════════ 주간 부위별 볼륨 ══════════════════════ */
function weekSets(){
  const m={};S.logs.filter(l=>l.date>daysAgo(7)).forEach(l=>l.exs.forEach(e=>{
    const p=partOf(e.name)||BPMAP[l.part];if(!p||!VOL.intermediate[p])return;m[p]=(m[p]||0)+e.sets.length;}));
  return m;
}
function zone(p,n){
  const t=(VOL[S.profile.exp]||VOL.intermediate)[p];
  if(!n)return{cls:'pri',l:'없음',t};
  if(n<t[0])return{cls:'pri',l:'부족',t};if(n<=t[1])return{cls:'good',l:'적정',t};if(n<=t[2])return{cls:'warn',l:'높음',t};return{cls:'bad',l:'과다',t};
}
function weekVolHTML(only){
  const ws=weekSets(),parts=PART6.filter(([k])=>!only||only.includes(k));
  return parts.map(([k,l])=>{const n=ws[k]||0,z=zone(k,n),pct=Math.min(100,n/z.t[2]*100);
    return`<div class="pb"><div class="pb-l"><span>${l} <span class="badge b-${z.cls}" style="padding:1px 7px;font-size:11px">${z.l}</span></span><span>${n}세트 <span class="tiny">/ 적정 ${z.t[0]}~${z.t[1]}</span></span></div>
    <div class="pb-bar" style="position:relative"><div class="pb-fill" style="width:${pct}%;background:var(--${z.cls==='pri'?'text3':z.cls})"></div>
    <i style="position:absolute;top:0;bottom:0;left:${z.t[0]/z.t[2]*100}%;width:2px;background:var(--card)"></i><i style="position:absolute;top:0;bottom:0;left:${z.t[1]/z.t[2]*100}%;width:2px;background:var(--card)"></i></div></div>`;}).join('');
}

function propagate(ei,si,k,v){const S2=draft.exs[ei].sets;for(let j=si+1;j<S2.length;j++){if(S2[j].done)continue;S2[j][k]=v;const el=document.querySelector(`[data-sv="${ei}-${j}-${k}"]`);if(el&&el!==document.activeElement)el.value=v;}}

function toggleDone(ei,si){const s=draft.exs[ei].sets[si];s.done=!s.done;if(s.done&&!num(s.r)){s.done=false;toast('횟수를 먼저 입력하세요');return;}saveDraft();renderExList();if(s.done)startRest();}

/* 휴식 타이머 */
let restEnd=0,restInt=null;
function startRest(sec){
  sec=sec??S.rest;if(!sec)return;restEnd=Date.now()+sec*1000;
  const el=$('rest');el.innerHTML=`<span class="rest-l">휴식</span><b id="restT"></b><button onclick="restEnd-=15000;tickRest()">−15초</button><button onclick="restEnd+=15000;tickRest()">+15초</button><button onclick="restEnd=0;tickRest()">건너뛰기</button>`;
  el.classList.add('on');document.body.classList.add('resting');clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest();
}
function tickRest(){scheduleRestNoti();
  const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){clearInterval(restInt);$('rest').classList.remove('on');document.body.classList.remove('resting');if(restEnd&&left>-2){try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}toast('휴식 끝 · 다음 세트');}return;}
  $('restT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}

function saveWorkout(){
  const log=finalizeLog({id:uid('l'),date:$('logDate').value||today(),memo:$('logMemo').value.trim(),
    exs:draft.exs.map(e=>({name:e.name,...(e.ss?{ss:e.ss}:{}),sets:e.sets.map(s=>({w:num(s.w),r:Math.round(num(s.r)),...(s.rir!=null?{rir:s.rir}:{})}))})),ts:Date.now()});
  if(draft.routine)log.title=draft.routine;
  if(draft.prog)log.prog=draft.prog;
  if(draft.startedAt)log.dur=Math.max(1,Math.round((Date.now()-draft.startedAt)/60000));
  if(!log.sets){toast('세트를 1개 이상 입력하세요');return;}
  const undone=draft.exs.reduce((a,e)=>a+e.sets.filter(s=>!s.done&&num(s.r)).length,0);
  const pc={};log.exs.forEach(e=>{const p=partOf(e.name);if(p)pc[p]=(pc[p]||0)+e.sets.length;});
  log.part=Object.keys(pc).sort((a,b)=>pc[b]-pc[a])[0]||'fullbody';log.parts=Object.keys(pc);
  if(S.check&&S.check.date===log.date){log.sleep=S.check.sleep;log.cond=S.check.cond;log.score=S.check.score;}
  const exist=S.logs.filter(l=>l.date===log.date).length;
  const doSave=()=>{restEnd=0;tickRest();S.logs.push(log);S.logs.sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
    window._adj=log.prog?evalProgLog(log):[];save();
    window._lastDraft=structuredClone(draft);showResult(log);resetLogForm();if(exist)toast(`오늘 ${exist+1}번째 세션으로 저장했어요`);};
  const go2=doSave;
  if(undone)confirmSheet(`완료 체크 안 한 세트 ${undone}개도 기록에 포함됩니다. 저장할까요?`,go2,'저장',false);else go2();
}
function prList(log){
  const out=[];BIG5.forEach(([k,n])=>{const e=log.exs.find(x=>x.name===n);if(!e)return;const best=Math.max(0,...e.sets.filter(s=>s.w&&s.r&&s.r<=12).map(s=>est1RM(s.w,s.r)));if(best)out.push({k,n,est:r1(best),cur:S.profile.rm[k]||0});});return out;
}

  const prs=prList(log),max=Math.max(1,...log.exs.map(e=>e.sets.reduce((s,x)=>s+x.w*x.r,0)));

  <div class="card"><div class="stats"><div class="stat"><b>${fmt(log.vol)}</b><span>총 볼륨 kg</span></div><div class="stat"><b>${log.sets}</b><span>세트</span></div><div class="stat"><b>${log.dur||log.exs.length}</b><span>${log.dur?'운동 시간(분)':'종목'}</span></div></div></div>

  <div class="card"><div class="card-t" style="margin-bottom:10px">종목별 볼륨</div>${log.exs.map(e=>{const v=e.sets.reduce((s,x)=>s+x.w*x.r,0);return`<div class="pb"><div class="pb-l"><span>${esc(e.name)} <span class="tiny">${e.sets.length}세트</span></span><span>${fmt(v)} kg</span></div><div class="pb-bar"><div class="pb-fill" style="width:${v/max*100}%"></div></div></div>`;}).join('')}</div>
  ${prs.length?`<div class="card"><div class="card-t" style="margin-bottom:6px">추정 1RM</div>${prs.map(r=>`<div class="li" style="padding:10px 0"><div class="li-main"><div class="li-t">${r.n}</div><div class="li-s">현재 프로필 ${r.cur||'미등록'} kg</div></div><div class="li-v">${r.est} kg ${r.est>r.cur?'<span class="badge b-good">PR</span>':''}</div></div>`).join('')}
  ${prs.some(r=>r.est>r.cur)?`<button class="btn sub" style="margin-top:10px" onclick="applyPRs()">프로필 1RM 업데이트</button>`:''}</div>`:''}
  ${(()=>{const rx=log.exs.filter(e=>exInfo(e.name).eq==='run');window._runEx=rx;return rx.length?`<div class="card"><div class="card-t" style="margin-bottom:8px">러닝 기록에 추가</div>${rx.map((e,i)=>`<div class="field"><label class="lbl">${esc(e.name)} · ${fmtT(e.sets.reduce((a,s)=>a+s.r,0))}</label><div class="unit-wrap"><input class="inp" id="rxKm${i}" inputmode="decimal" placeholder="거리"><span class="u">km</span></div></div>`).join('')}<button class="btn sub" onclick="addRunsFromLog()">러닝 기록으로 저장</button></div>`:'';})()}
  <button class="btn ghost" onclick="routineFromDraft(window._lastDraft)">이 운동을 루틴으로 저장</button>`);
}
function addRunsFromLog(){
  const tm={'이지런':'easy','템포런':'tempo','인터벌 런':'interval','롱런':'long'};let n=0;

  if(!n){toast('거리를 입력하세요');return;}S.runs.sort((a,b)=>a.date.localeCompare(b.date));save();toast(`러닝 ${n}건 저장됨`);closeSheet();
}
function applyPRs(){(window._prs||[]).forEach(r=>{if(r.est>(S.profile.rm[r.k]||0))S.profile.rm[r.k]=r.est;});save();closeSheet();toast('1RM 업데이트 완료');}

/* 러닝 */
const RT_L={easy:'이지',tempo:'템포',interval:'인터벌',long:'롱런',race:'레이스'};let runT='easy';
function renderRunType(){$('runType').innerHTML=Object.entries(RT_L).map(([k,l])=>`<button class="chip ${runT===k?'on':''}" onclick="runT='${k}';renderRunType()">${l}</button>`).join('');}
const secStr=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');};
function runBest(){let b=null;S.runs.filter(r=>r.km>=3&&r.min&&r.date>=daysAgo(120)).forEach(r=>{const t5=r.min*60*Math.pow(5/r.km,1.06);if(!b||t5<b.t5)b={r,t5};});return b;}
function paceStr(km,min){if(!km||!min)return'';const s=min*60/km;return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');}
function runPaceLive(){$('runPace').value=paceStr(num($('runKm').value),num($('runMin').value));}
function saveRun(){
  const r={id:uid('r'),date:$('runDate').value||today(),type:runT,km:num($('runKm').value),min:num($('runMin').value),hr:Math.round(num($('runHr').value)),memo:$('runMemo').value.trim(),link:($('runLink').value.trim().match(/^https?:\/\/\S+/)||[''])[0]};
  if(!r.km){toast('거리를 입력하세요');return;}
  S.runs.push(r);S.runs.sort((a,b)=>a.date.localeCompare(b.date));save();
  ['runKm','runMin','runHr','runMemo','runPace','runLink'].forEach(id=>$(id).value='');
  const wk=S.runs.filter(x=>x.date>=daysAgo(6)).reduce((s,x)=>s+x.km,0),prev=S.runs.filter(x=>x.date>=daysAgo(13)&&x.date<daysAgo(6)).reduce((s,x)=>s+x.km,0);
  const maxHr=S.profile.age?Math.round(208-.7*S.profile.age):0,pct=r.hr&&maxHr?Math.round(r.hr/maxHr*100):0;
  const zn=pct?(pct<60?'Z1 회복':pct<70?'Z2 지방 연소':pct<80?'Z3 유산소':pct<90?'Z4 역치':'Z5 최대'):'';
  openSheet(`<div class="sheet-h"><h2>러닝 완료</h2><button class="link" onclick="closeSheet()">닫기</button></div>

function parseLine(s){const m=s.match(/^(.*?)\s*(\d+)\s*[×xX*]\s*(\d+)/);if(!m)return{name:s.replace(/\(.*?\)/g,'').trim(),n:3,r:10};return{name:m[1].replace(/\(.*?\)/g,'').trim(),n:Math.min(10,+m[2]),r:+m[3]};}

function overload(name,reps){
  const last=lastOf(name);if(!last||!reps||isTimed(name))return{};const w=last.sets[0].w;
  const rr=last.sets.map(s=>s.rir).filter(v=>v!=null),ar=rr.length?rr.reduce((a,b)=>a+b,0)/rr.length:null;

  if(w>0&&last.sets.every(s=>s.r>=reps)){const inc=['legs','back'].includes(partOf(name))?5:2.5;return{w:round25(w+inc),up:inc};}return{};

function exRMHist(name){const out=[];S.logs.forEach(l=>{let b=0,bw=0,br=0;l.exs.forEach(e=>{if(e.name!==name)return;e.sets.forEach(x=>{if(x.done===false||!x.w||!x.r||x.r>12)return;const v=est1RM(x.w,x.r);if(v>b){b=v;bw=x.w;br=x.r;}});});if(b)out.push({date:l.date,rm:r1(b),w:bw,r:br});});return out;}
function hwEx(){
  const cnt={};S.logs.forEach(l=>l.exs.forEach(e=>{if(e.sets.some(x=>x.w&&x.r&&x.r<=12))cnt[e.name]=(cnt[e.name]||0)+1;}));
  const names=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);

/* 정체 감지: 최근 3주 이상 추정 1RM이 최고치 2.5% 안에서 머문 주요 종목 */
function plateaus(){
  const out=[];const cnt={};S.logs.slice(-40).forEach(l=>l.exs.forEach(e=>cnt[e.name]=(cnt[e.name]||0)+1));
  Object.entries(cnt).filter(x=>x[1]>=4).forEach(([n])=>{const H=exRMHist(n);if(H.length<5)return;
    const best=Math.max(...H.map(x=>x.rm)),bi=H.findIndex(x=>x.rm===best),since=H[bi].date;
    const wk=Math.floor((new Date(today()+'T12:00')-new Date(since+'T12:00'))/864e5/7);
    const after=H.slice(bi+1);if(wk>=3&&after.length>=3&&H.at(-1).date>=daysAgo(10))out.push({name:n,weeks:wk,best:Math.round(H[bi].w)});});
  return out.slice(0,3);
}

function deloadInfo(){
  const L=S.logs;if(L.length<4)return null;
  const weeks=[0,1,2,3].map(i=>L.filter(l=>l.date<=daysAgo(i*7)&&l.date>daysAgo(i*7+7)));
  const vols=weeks.map(w=>w.reduce((s,l)=>s+l.vol,0));
  const recent=L.slice(-8),conds=recent.filter(l=>l.cond),sleeps=recent.filter(l=>l.sleep);
  const cond=conds.length?r1(conds.reduce((s,l)=>s+l.cond,0)/conds.length):0,sleep=sleeps.length?sleeps.reduce((s,l)=>s+l.sleep,0)/sleeps.length:7;
  let sc=0;if(cond&&cond<5)sc+=30;else if(cond&&cond<7)sc+=15;if(sleep<6)sc+=25;else if(sleep<7)sc+=10;
  if(vols[0]<Math.max(...vols)*.7&&vols[0]<vols[3])sc+=25;
  const weeksOn=weeks.filter(w=>w.length).length;if(weeksOn>=4)sc+=20;
  if(sc>=70)return{score:sc,cond,weeks:weeksOn,cls:'bad',l:'디로드 필요',d:'5~7일간 세트 수를 절반으로, 중량을 1RM의 60~70%로 낮추고 수면 8시간을 확보하세요. 복귀 후 80% → 90% → 100%로 올립니다.'};
  if(sc>=50)return{score:sc,cond,weeks:weeksOn,cls:'warn',l:'디로드 시점',d:'피로가 쌓이고 있습니다. 이번 주 또는 다음 주에 볼륨 40~60% 축소 주간을 넣어보세요.'};
  return{score:sc,cond,weeks:weeksOn,cls:'good',l:'정상 훈련',d:'현재 강도를 유지하면서 점진적 과부하를 이어가세요. 4~6주 고강도 후 1주 디로드가 기본 주기입니다.'};
}

function ibStd(){
  const p=S.profile;if(!p.height)return null;const h=p.height/100,m=p.gender!=='female';
  const sw=(m?22:21)*h*h,sp=m?.15:.23,sf=sw*sp,ssm=(sw-sf)*(m?.577:.553);

}
const IB_T={w:[55,70,85,100,115,130,145,160,175,190,205],m:[70,80,90,100,110,120,130,140,150,160,170],f:[40,60,80,100,160,220,280,340,400,460,520]};
function ibX(k,v){const t=IB_T[k];if(v<=t[0])return 0;for(let i=1;i<t.length;i++)if(v<=t[i])return(i-1+(v-t[i-1])/(t[i]-t[i-1]))/(t.length-1)*100;return 100;}
function ibBar(lbl,val,std,lo,hi,unit,k){

    const msg=dm>0&&df<0?'근육 증가와 체지방 감소가 동시에 일어났습니다. 가장 좋은 변화입니다.':dm>0&&df>0?`근육 +${dm}kg, 지방 +${df}kg. 지방 증가가 근육 증가의 절반 이하면 양호한 벌크입니다.`:dm<0&&df<0?`지방 ${df}kg과 함께 근육도 ${dm}kg 줄었습니다. 단백질 섭취와 운동 강도를 점검하세요.`:dm<=0&&df>0?'근육은 줄고 지방이 늘었습니다. 운동 빈도와 식단을 다시 점검하세요.':'큰 변화가 없습니다.';

    delta=`<div class="sec" style="margin:14px 0 6px">지난 측정(${md(pv.date)}) 대비</div><div class="stats"><div class="stat">${f(dw)}<span>체중</span></div><div class="stat">${f(dm)}<span>골격근</span></div><div class="stat">${f(df)}<span>체지방</span></div></div><div class="note n-pri" style="margin-top:8px">${msg}</div>`;}

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="badge b-${tc}" style="font-size:13px;padding:5px 11px">${type}</span></div>

function ocrPrep(img){ // 흑백 + 대비 늘리기 + 해상도 맞추기

async function importRunFiles(ev){
  const files=[...ev.target.files];ev.target.value='';if(!files.length)return;let ok=0,dup=0,fail=[];
  for(const f of files){try{const r=parseRunFile(await f.text(),f.name);r.km=Math.round(r.km*100)/100;
      if(S.runs.some(x=>x.start&&x.start===r.start)){dup++;continue;}S.runs.push(r);ok++;window._lastRun=r.id;}catch(e){fail.push(f.name+': '+e.message);}}
  S.runs.sort((a,b)=>a.date.localeCompare(b.date));save();
  toast(`가져옴 ${ok}건${dup?` · 중복 ${dup}`:''}${fail.length?` · 실패 ${fail.length}`:''}`);
  if(fail.length)openSheet(`<div class="sheet-h"><h2>일부 실패</h2><button class="link" onclick="closeSheet()">닫기</button></div><div class="card muted">${fail.map(esc).join('<br>')}</div>`);

}

// 가져온 백업·동기화 데이터 정리: id는 영문·숫자만, 글자 길이와 개수 제한 (조작된 파일 방어)
const SAFE_ID=/^[A-Za-z0-9_-]{1,40}$/;
function sanitizeData(d){
  if(!d||typeof d!=='object')return d;
  const fixId=o=>{if(o&&typeof o==='object'&&'id' in o&&!SAFE_ID.test(String(o.id)))o.id=uid('x');};
  const walk=(v,depth)=>{if(depth>8)return null;if(typeof v==='string')return v.length>500?v.slice(0,500):v;
    if(Array.isArray(v))return v.slice(0,50000).map(x=>walk(x,depth+1));
    if(v&&typeof v==='object'){fixId(v);for(const k of Object.keys(v)){if(k==='__proto__'||k==='constructor'||k==='prototype'){delete v[k];continue;}v[k]=walk(v[k],depth+1);}}return v;};
  walk(d,0);if(d.prog&&!progById(d.prog.id))d.prog=null;return d;
}
function mergeIn(d){
  sanitizeData(d);
  if(d.profile&&(d.profile.weight||d.profile.name))S.profile={...S.profile,...d.profile,rm:{...S.profile.rm,...(d.profile.rm||{})}};
  const by=(arr,inc,key)=>{const m=new Map(arr.map(x=>[key(x),x]));(inc||[]).forEach(x=>m.set(key(x),x));return[...m.values()].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));};
  S.logs=by(S.logs,d.logs,x=>x.id||x.date);S.bw=by(S.bw,d.bw,x=>x.date);S.runs=by(S.runs,d.runs,x=>x.id);S.food=by(S.food,d.food,x=>x.id);
  S.routines=by(S.routines,(d.routines||[]).map(normRoutine),x=>x.id||x.name);
  (d.customEx||[]).forEach(x=>{if(!S.customEx.some(y=>y.name===x.name))S.customEx.push(x);});
  if(d.prog&&!S.prog)S.prog=d.prog;
  (d.wods||[]).forEach(m=>{S.wods=S.wods||[];if(!S.wods.some(x=>x.id===m.id))S.wods.push(m);});
  (d.myWods||[]).forEach(m=>{S.myWods=S.myWods||[];if(!S.myWods.some(x=>x.id===m.id))S.myWods.push(m);});
  if(Array.isArray(d.supps))S.supps=[...new Set([...(S.supps||[]),...d.supps.filter(x=>SUPPS.some(y=>y[0]===x))])];
  if(d.suppLog&&typeof d.suppLog==='object'){S.suppLog=S.suppLog||{};for(const[k,v]of Object.entries(d.suppLog))if(/^\d{4}-\d\d-\d\d$/.test(k)&&Array.isArray(v))S.suppLog[k]=[...new Set([...(S.suppLog[k]||[]),...v.filter(x=>typeof x==='string')])];}
  if(d.suppCfg&&typeof d.suppCfg==='object'&&!S.suppCfg)S.suppCfg={p:num(d.suppCfg.p)||24,kcal:num(d.suppCfg.kcal)||120,c:3,f:2};
  if(Array.isArray(d.meds)&&(S.medSync||d.medSync)){S.meds=[...new Set([...(S.meds||[]),...d.meds.filter(x=>MEDS.some(y=>y[0]===x))])];if(d.medAgree)S.medAgree=1;if(d.medSync)S.medSync=1;}
  if(d.water&&typeof d.water==='object'){S.water=S.water||{};for(const[k,v]of Object.entries(d.water))if(/^\d{4}-\d\d-\d\d$/.test(k)&&typeof v==='number')S.water[k]=Math.max(S.water[k]||0,v);}
  (d.meals||[]).forEach(m=>{S.meals=S.meals||[];if(!S.meals.some(x=>x.id===m.id))S.meals.push(m);});
}

  if(!FB_CFG||!FB_CFG.apiKey||/여기/.test(FB_CFG.apiKey)||!FB_CFG.databaseURL){fb.err='클라우드 설정이 아직 없습니다. firebase-config.js에 Firebase 구성 값을 넣어주세요.';acctRefresh();return false;}
  try{const v='10.12.2',b=`https://www.gstatic.com/firebasejs/${v}/`;
    if(!window.firebase){await loadJS(b+'firebase-app-compat.js');await loadJS(b+'firebase-auth-compat.js');await loadJS(b+'firebase-database-compat.js');}
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
    fb.auth=firebase.auth();fb.db=firebase.database();
    await fb.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    fb.auth.getRedirectResult().catch(e=>{fb.err=authMsg(e);});
    fb.auth.onAuthStateChanged(u=>{fb.user=u;if(u){S.cloud=1;saveLocal();syncNow();}acctRefresh();});
    fb.ready=true;return true;
  }catch(e){fb.err='Firebase에 연결하지 못했습니다. 인터넷을 확인하세요.';acctRefresh();return false;}
}

/* 클라우드 본문 압축: 'gz:'+base64(gzip). 압축 미지원 브라우저는 평문 */
async function packJSON(str){
  if(typeof CompressionStream==='undefined')return str;
  try{const buf=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    const u=new Uint8Array(buf);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return'gz:'+btoa(b);}catch(e){return str;}
}
async function unpackJSON(raw){
  if(typeof raw!=='string'||!raw.startsWith('gz:'))return raw;
  const bin=atob(raw.slice(3)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

async function syncNow(manual){
  if(!fb.user||fb.busy)return;fb.busy=true;fb.state='동기화 중';acctRefresh();
  try{
    const ref=fb.db.ref(`users/${fb.user.uid}/ohun`);

    const rU=(await ref.child('updatedAt').get()).val()||0;
    let push=false;
    const changed=rU&&rU!==(S.syncedRemote||0),dirty=!!S.dirty;
    if(rU&&!changed){push=dirty;}
    else if(rU){
      const raw=(await ref.child('json').get()).val();
      const remote=sanitizeData(JSON.parse(await unpackJSON(raw)));
      if(changed&&dirty){mergeIn(remote);push=true;if(manual!=='silent')toast('다른 기기 기록과 합쳤습니다');}
      else if(changed){const keep={theme:S.theme,hideInstall:S.hideInstall,cloud:1};S={...structuredClone(DEF),...remote,...keep};S.routines=(S.routines||[]).map(normRoutine);S.dirty=0;S.syncedRemote=rU;applyTheme();if(manual!=='silent')toast('클라우드 기록을 불러왔습니다');}
      else push=dirty;
    }else{
      push=true;
      const old=(await fb.db.ref(`users/${fb.user.uid}`).get()).val();
      if(old&&(old.logs||old.profiles)&&!S.oldCloudAsked){S.oldCloudAsked=1;
        const d={profiles:arrOf(old.profiles),logs:arrOf(old.logs),runLogs:arrOf(old.runLogs),bwLog:arrOf(old.bwLog),foodLog:arrOf(old.foodLog)};
        setTimeout(()=>confirmSheet(`이전 Road to Strongman 클라우드에서 운동 ${d.logs.length}건을 찾았습니다. 가져올까요?`,()=>{mergeIn(convertV3(d));save();go(curTab);toast('이전 기록을 가져왔습니다');},'가져오기',false),300);}
    }
    if(push){const t=Date.now();S.dirty=0;S.updatedAt=t;S.syncedRemote=t;await ref.set({json:await packJSON(JSON.stringify(cloudView())),updatedAt:t,device:navigator.userAgent.slice(0,80)});}
    saveLocal();fb.state='완료 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});fb.err='';
    if(changed&&!push||changed&&dirty)go(curTab);
  }catch(e){fb.state='실패';fb.err=e.code==='PERMISSION_DENIED'||/permission/i.test(e.message)?'데이터베이스 권한이 없습니다. 보안 규칙을 확인하세요.':'동기화 실패: '+(e.message||'');}
  fb.busy=false;acctRefresh();
}

const PK_NAME={squat:'스쿼트',bench:'벤치프레스',dead:'데드리프트',ohp:'오버헤드프레스',row:'바벨로우'};
function rmOf(k){
  const v=S.profile.rm[k];if(v>0)return v;
  const n=PK_NAME[k];let best=0;S.logs.slice(-60).forEach(l=>l.exs.forEach(e=>{if(e.name===n)e.sets.forEach(s=>{const w=num(s.w),r=num(s.r);if(w>0&&r>0&&r<=12)best=Math.max(best,est1RM(w,r));});}));
  return best;
}
const RD=x=>x>0?round25(x):'';
const isLow=k=>k==='squat'||k==='dead';
const rampS=(t,ms,r)=>ms.map(m=>[RD(t*m),r]);
const pctS=(k,list,base)=>{const b=base!=null?base:rmOf(k);return list.map(([p,r,a])=>[RD(b*p),r,a]);};
const RUN_PACE={이지런:375,템포런:330,롱런:375,'인터벌 런':300};
// 아이템: {n, s, r, w} 고정 / {n, f:(w)=>[[kg,reps,amrap]...]} 계산 / {n, km} 러닝
function itemSets(it,w){
  if(it.f)return it.f(w).map(([kg,r,a])=>({w:kg,r,a:!!a}));
  if(it.km)return Array.from({length:it.s||1},()=>({w:'',r:Math.round(it.km*(RUN_PACE[it.n]||360)/60)*60,km:it.km}));
  return Array.from({length:it.s||3},()=>({w:it.w||'',r:it.r||10}));
}
function setsLabel(it,w){
  const ss=itemSets(it,w);if(!ss.length)return'';
  if(ss[0].km)return ss.length>1?`${ss.length}×${ss[0].km}km`:`${ss[0].km}km · 약 ${Math.round(ss[0].r/60)}분`;
  const u=unitOf(it.n),suf=s=>u==='회'?(s.w?'':'회'):u;
  const g=[];ss.forEach(s=>{const k=(s.w?s.w+'kg×':'')+s.r+suf(s)+(s.a?'+':''),l=g[g.length-1];if(l&&l.k===k)l.n++;else g.push({k,n:1});});
  if(g.length===1)return`${ss.length}세트 · ${g[0].k}`;
  return g.map(x=>x.n>1?`${x.k} ${x.n}세트`:x.k).join(' · ');
}

const smo=(k,add)=>w=>{const a=add[Math.min(w,3)-1];return[[.70,6,6],[.75,7,5],[.80,8,4],[.85,10,3]].map(([p,s,r])=>Array(s).fill([RD(rmOf(k)*p+a),r]));};

/* ══════════════════════ v6: 자동 조정 · RIR · 공유 카드 · 주간 리포트 · 슈퍼세트 · 바코드 · 휴식 알림 ══════════════════════ */
/* ── 프로그램 자동 조정 (실제 수행 기반) ── */
function progAdjOf(pid,name){return((S.progAdj||{})[pid]||{})[name]||0;}
function progItems(p,d,w){
  return dayItems(d,w).map(it=>{const off=progAdjOf(p.id,it.n);if(!off||!it.f)return it;const f0=it.f;
    return{...it,adj:off,f:w2=>f0(w2).map(([kg,r,a])=>[kg?RD(Math.max(0,kg+off)):kg,r,a])};});
}
function topKg(it,w){let m=0;if(it.f)it.f(w).forEach(([kg])=>{if(kg>m)m=kg;});return m;}
function evalProgLog(log){
  const pr=log.prog,p=pr&&progById(pr.id);if(!p)return[];
  S.progAdj=S.progAdj||{};S.progStat=S.progStat||{};
  const A=S.progAdj[p.id]=S.progAdj[p.id]||{},ST=S.progStat[p.id]=S.progStat[p.id]||{},out=[],seen={};
  dayItems(p.days[pr.di],pr.w).forEach(it=>{
    if(!it.f||seen[it.n])return;const tgt=it.f(pr.w);if(!tgt.some(t=>t[0]>0))return;seen[it.n]=1;
    const le=log.exs.find(e=>e.name===it.n);if(!le)return;
    const fail=tgt.some((t,i)=>{const s=le.sets[i];return!s||s.r<t[1];});
    const rirs=le.sets.map(s=>s.rir).filter(v=>v!=null),avg=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
    const old=A[it.n]||0,now=topKg(it,pr.w),nx=pr.w<p.weeks?topKg(it,pr.w+1):now,inc=nx-now,did=RD(now+old),low=isLow(Object.keys(PK_NAME).find(k=>PK_NAME[k]===it.n)||'')||partOf(it.n)==='legs';
    if(fail){
      ST[it.n]=(ST[it.n]||0)+1;
      if(ST[it.n]>=2){A[it.n]=old-Math.max(inc,0)-RD(did*0.1);ST[it.n]=0;out.push([it.n,`2회 연속 목표 미달 · 다음 주 약 10% 디로드 (${RD(did*0.9)}kg 전후)`,'bad']);}
      else if(inc>0){A[it.n]=old-inc;out.push([it.n,`목표 미달 · 다음 주에도 ${did}kg 유지`,'warn']);}
      else out.push([it.n,'목표 미달 · 다음 주 컨디션을 보고 진행','warn']);
    }else{
      ST[it.n]=0;
      if(avg!=null&&avg>=4){const b=low?5:2.5;A[it.n]=old+b;out.push([it.n,`여유 충분 (평균 ${r1(avg)}개 더 가능) · 다음 주 +${b}kg`,'good']);}
      else out.push([it.n,`목표 달성 · 계획대로 진행${avg!=null?` (평균 ${r1(avg)}개 여유)`:''}`,'good']);
    }
  });
  return out;
}

function ssAdvance(){  // 슈퍼세트면 같은 라운드의 다음 종목으로 휴식 없이 이동. 이동했으면 true
  const e=draft.exs[wm.ei];if(!e||!e.ss)return false;
  const G=draft.exs.map((x,i)=>x.ss===e.ss?i:-1).filter(i=>i>=0),pos=G.indexOf(wm.ei);
  for(let k=pos+1;k<G.length;k++){const gi=G[k];if(draft.exs[gi].sets.some(s=>!s.done)){wm.ei=gi;wm.phase='set';return true;}}
  const f=G.find(gi=>draft.exs[gi].sets.some(s=>!s.done));if(f!=null){wm.ei=f;wm.ssRest=true;}
  return false;
}

/* ── 공유 카드 (스토리 1080×1920) ── */
function drawBarbell(g,cx,cy,w,a){
  // w = 봉 전체 길이. 모든 치수를 w에 비례시켜 미리보기·원본 크기에서 같은 모양
  const u=w/1000,G=g,oc=document.createElement('canvas');oc.width=G.canvas.width;oc.height=G.canvas.height;g=oc.getContext('2d');g.fillStyle='#fff';const rr=(x,y,ww,hh,r)=>{g.beginPath();g.roundRect(x,y,ww,hh,Math.max(1,r));g.fill();};
  rr(cx-w/2,cy-7*u,w,14*u,7*u);                                        // 봉
  [-1,1].forEach(d=>{const c0=cx+d*300*u;                               // 칼라(안쪽 멈춤쇠) 위치
    rr(d>0?c0:c0-16*u,cy-26*u,16*u,52*u,4*u);
    let o=22*u;[[300,44],[300,44],[220,34],[150,26]].forEach(([h,t])=>{h*=u;t*=u;rr(d>0?c0+o:c0-o-t,cy-h/2,t,h,6*u);o+=t+5*u;});  // 20kg×2·10kg·5kg
    rr(d>0?c0+o:c0-o-14*u,cy-14*u,14*u,28*u,4*u);});                       // 바깥 칼라
  G.save();G.setTransform(1,0,0,1,0,0);G.globalAlpha=a;G.drawImage(oc,0,0);G.restore();
}
function loadImg(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src;});}
/* ── 주간 리포트 ── */
function weekBounds(off){const m=mondayOf(new Date());m.setDate(m.getDate()+off*7);const e=new Date(m);e.setDate(e.getDate()+6);return[ymdL(m),ymdL(e)];}
function weekStats(off){
  const[a,b]=weekBounds(off),L=S.logs.filter(l=>l.date>=a&&l.date<=b),R=S.runs.filter(r=>r.date>=a&&r.date<=b);
  const parts={};L.forEach(l=>l.exs.forEach(e=>{const p=partOf(e.name)||BPMAP[l.part];if(p&&VOL.intermediate[p])parts[p]=(parts[p]||0)+e.sets.length;}));
  return{a,b,L,R,n:L.length,days:new Set(L.map(l=>l.date)).size,vol:L.reduce((s,l)=>s+(l.vol||0),0),sets:L.reduce((s,l)=>s+(l.sets||0),0),km:r1(R.reduce((s,r)=>s+(r.km||0),0)),parts};
}
function weekPRs(a,b){
  const best={},out=[];S.logs.forEach(l=>l.exs.forEach(e=>e.sets.forEach(s=>{if(!(s.w>0&&s.r>0&&s.r<=12))return;const v=est1RM(s.w,s.r);
    if(l.date<a){best[e.name]=Math.max(best[e.name]||0,v);}else if(l.date<=b&&best[e.name]&&v>best[e.name]*1.005){const o=out.find(x=>x.n===e.name);if(!o||v>o.v)(o?Object.assign(o,{v,s}):out.push({n:e.name,v,s,prev:best[e.name]}));}})));
  return out.sort((x,y)=>y.v/y.prev-x.v/x.prev).slice(0,5);

/* ══════════════════════ 식약처 식품영양성분 DB (공공데이터포털 · 정적 파일) ══════════════════════ */
// data/food-kr-1.tsv.gz: 음식(외식·프랜차이즈 포함) + 원재료  ·  data/food-kr-2.tsv.gz: 가공식품
// 줄 형식: 이름 \t kcal \t 단백질 \t 탄수 \t 지방 \t (1=100ml 기준) \t 1회 제공량 \t 업체/브랜드 \t 분류 \t 구분(D 음식, R 원재료, P 가공)
const KDB={rows:[],keys:[],st:{1:0,2:0},err:''};   // st: 0 없음, 1 불러오는 중, 2 완료
// gzip 파일을 받아 풀기. 서버가 이미 풀어서 보내 준 경우(gzip 표시가 없으면)도 그대로 처리
async function gzFetch(paths){
  let last='';
  for(const u of paths){
    try{const r=await fetch(u);if(r.status===429||r.status===403)throw new Error('GitHub 접속 제한(잠시 후 다시)');if(!r.ok){last=`${u} (${r.status})`;continue;}
      const buf=new Uint8Array(await r.arrayBuffer());
      if(buf[0]===0x1f&&buf[1]===0x8b){
        if(!('DecompressionStream' in window))throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다 (iOS 16.4 이상 필요)');
        return new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());}
      return buf;
    }catch(e){last=e.message||String(e);}
  }
  throw new Error('파일을 찾지 못함: '+last);
}
async function kdbFetch(n){
  const f=`food-kr-${n}.tsv.gz`;
  return new TextDecoder().decode(await gzFetch([`data/${f}`,f,`ohun/data/${f}`]));
}
async function kdbLoad(n){
  if(KDB.st[n])return;KDB.st[n]=1;kdbStatus();
  try{const t=await kdbFetch(n);const L=t.split('\n');for(const l of L){if(!l)continue;KDB.rows.push(l);const a=nthTab(l,7);KDB.keys.push((l.slice(0,l.indexOf('\t'))+l.slice(a+1,nthTab(l,8))).toLowerCase().replace(/[\s_·]/g,''));}
    KDB.st[n]=2;KDB.err='';}catch(e){KDB.st[n]=0;KDB.err=e.message;KDB.failAt=Date.now();}
  kdbStatus();if($('foodQ')&&$('foodQ').value.trim())kdbRender();
}
function nthTab(s,n){let p=-1;for(let k=0;k<n;k++){p=s.indexOf('\t',p+1);if(p<0)return s.length;}return p;}
function kdbParse(l){const a=l.split('\t');return{name:a[0].replace(/_/g,' · '),k:+a[1],p:+a[2],c:+a[3],f:+a[4],ml:a[5]==='1',size:a[6]||'',src:a[7]||'',cat:a[8]||'',t:a[9]||''};}
function kdbStatus(){const el=$('kdbSt');if(!el)return;
  const n=fmt(KDB.rows.length);
  el.textContent=KDB.st[1]===1?'식약처 DB 불러오는 중...':KDB.st[2]===1?`음식·원재료 ${n}개 준비됨 · 가공식품 불러오는 중 (처음 한 번, 약 6MB)`:KDB.st[2]===2?`식약처 DB ${n}개에서 검색`:KDB.err?'식약처 DB를 불러오지 못했어요: '+KDB.err+' · 5분 뒤 자동으로 다시 시도합니다':'';}
function kdbSearch(q,lim=30){
  const toks=q.toLowerCase().split(/\s+/).map(t=>t.replace(/[_·]/g,'')).filter(Boolean);if(!toks.length)return[];
  const qq=toks.join(''),hits=[];
  for(let i=0;i<KDB.keys.length;i++){const k=KDB.keys[i];if(toks.every(t=>k.includes(t))){hits.push(i);if(hits.length>=1500)break;}}
  const sc=i=>{const l=KDB.rows[i],nm=l.slice(0,l.indexOf('\t')).toLowerCase().replace(/[\s_·]/g,''),t=l.slice(l.lastIndexOf('\t')+1);
    return(nm===qq?0:nm.startsWith(qq)?1:nm.includes(qq)?2:3)*10+(t==='P'?8:t==='R'?-5:0)+Math.min(9,nm.length/8);};
  const seen=new Set(),out=[];for(const[,i]of hits.map(i=>[sc(i),i]).sort((a,b)=>a[0]-b[0])){const l=KDB.rows[i],k=l.split('\t').slice(0,5).join('|');if(seen.has(k))continue;seen.add(k);out.push(i);if(out.length>=lim)break;}return out;
}
let _kdbT=null;

function nameMatch(name,q,en){
  const qq=normQ(q);if(!qq)return true;const n=normQ(name);if(n.includes(qq))return true;
  if(/^[ㄱ-ㅎ]+$/.test(qq)&&choOf(n).includes(qq))return true;
  if(en&&normQ(en).includes(qq))return true;
  return false;
}

/* ── 자주 먹는 음식 · 끼니 템플릿 ── */
function freqFoods(n=10){
  const m=new Map(),since=daysAgo(60);
  S.food.filter(f=>f.date>=since).forEach(f=>{const o=m.get(f.name)||{c:0,f:null};o.c++;if(!o.f||f.date>=o.f.date)o.f=f;m.set(f.name,o);});
  return[...m.values()].sort((a,b)=>b.c-a.c||(b.f.date>a.f.date?1:-1)).slice(0,n).map(o=>({...o.f,cnt:o.c}));
}
function quickAddFood(name){const f=freqFoods(50).find(x=>x.name===name);if(!f)return;addFoodEntry({id:uid('f'),date:today(),name:f.name,kcal:f.kcal,p:f.p,c:f.c,f:f.f});save();renderDiet();toast(`${f.name} 추가됨`);}

function csvEsc(v){v=v==null?'':String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function dlCSV(name,rows){const s='﻿'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}

  if(k==='runs')dlCSV(`ohun_러닝_${d}.csv`,[['날짜','종류','거리(km)','시간(분)','평균 심박','메모'],...S.runs.map(r=>[r.date,RT_L&&RT_L[r.type]||r.type,r.km,r.min,r.hr||'',r.memo||''])]);
  if(k==='food')dlCSV(`ohun_식단_${d}.csv`,[['날짜','음식','kcal','단백질(g)','탄수화물(g)','지방(g)'],...S.food.map(f=>[f.date,f.name,f.kcal,f.p,f.c,f.f])]);
  if(k==='bw')dlCSV(`ohun_체중인바디_${d}.csv`,[['날짜','체중(kg)','골격근량(kg)','체지방량(kg)'],...S.bw.map(b=>[b.date,b.weight,b.muscle||'',b.fat||''])]);
  toast('CSV 파일을 저장했습니다');
}
